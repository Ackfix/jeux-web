<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drift Blitz</title>
<style>
:root{--acc:#ffcc2e;--accG:rgba(255,204,46,.45)}
html,body{margin:0;height:100%;background:#0b0d12;color:#eef2f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:safe center;background:rgba(6,7,12,.72);flex-direction:column;gap:14px;padding:18px;text-align:center;box-sizing:border-box;overflow:auto;z-index:5}
.overlay.show{display:flex}
h1{margin:0;font-size:clamp(44px,9vw,78px);font-weight:900;letter-spacing:6px;font-style:italic;color:var(--acc);text-shadow:0 0 26px var(--accG),4px 4px 0 #c2410c}
h2{margin:0;font-size:38px;font-weight:900;font-style:italic;color:var(--acc)}
h3{margin:0;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
p{margin:0;max-width:560px;line-height:1.45;color:#c9d2e0}
.small{font-size:13px;opacity:.65}
.btn{background:var(--acc);color:#14100a;border:0;border-radius:12px;padding:13px 40px;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:1px;font-style:italic}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#232a3a;color:#eef2f8;font-style:normal}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.55}
.langs button.sel{border-color:var(--acc);opacity:1}
.langs svg{border-radius:2px;display:block}
.maps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px}
.map{width:150px;border-radius:12px;border:3px solid transparent;cursor:pointer;overflow:hidden;background:#141924}
.map.sel{border-color:var(--acc)}
.map img{display:block;width:100%;height:84px;object-fit:cover}
.map div{padding:5px 8px;font-weight:800;font-size:13px;text-align:left}
.diff{display:flex;gap:6px}
.diff button{background:#1b2130;color:#cfd6e4;border:2px solid #2a3245;border-radius:9px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:13px}
.diff button.sel{border-color:var(--acc);color:#fff;background:#2a2410}
.garage{display:flex;gap:16px;align-items:center;background:#141924;border-radius:16px;padding:10px 18px}
.garage canvas{width:120px;height:72px}
.garage .opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.7)}
#hud.hide{display:none}
.hl{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:2px}
.hl .big{font-size:34px;font-style:italic;color:var(--acc)}
.hl .big small{font-size:18px;color:#fff;opacity:.8}
.hl .mid{font-size:16px}
.hl .lo{font-size:13px;opacity:.75;font-weight:700}
#mini{position:absolute;right:12px;top:58px;width:150px;height:105px;opacity:.9}
#pauseBtn{position:absolute;right:12px;top:12px;pointer-events:auto;background:rgba(20,25,36,.85);color:#fff;border:0;border-radius:10px;width:40px;height:38px;font-size:16px;cursor:pointer}
.hb{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px}
.spd{font-size:30px;font-style:italic;min-width:120px;text-align:right}
.spd small{font-size:13px;opacity:.7}
.nitro{width:150px;height:14px;border-radius:7px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);overflow:hidden}
.nitro i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa);transition:width .1s}
.nitro.full{border-color:#7dd3fc;box-shadow:0 0 12px #38bdf8}
#msg{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:clamp(40px,10vw,96px);font-style:italic;color:var(--acc);text-shadow:0 0 30px var(--accG),4px 4px 0 #000;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#touch.on{display:block}
#touch button{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.35);background:rgba(15,18,28,.45);color:#fff;font-weight:900;border-radius:50%;width:74px;height:74px;font-size:26px;touch-action:none}
#touch button.on{background:rgba(255,204,46,.45)}
#tl{left:16px;bottom:22px}#tr{left:102px;bottom:22px}
#tg{right:16px;bottom:22px;width:84px!important;height:84px!important}#tb{right:112px;bottom:16px;width:62px!important;height:62px!important;font-size:18px!important}
#tn{right:30px;bottom:122px;width:58px!important;height:58px!important;font-size:20px!important}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ctabs button{background:#1b2130;color:#cfd6e4;border:0;border-radius:9px;padding:7px 14px;font-weight:800;cursor:pointer}
.ctabs button.sel{background:var(--acc);color:#14100a}
.cgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px;min-height:60px}
.cgrid button{background:#1b2130;border:2px solid #2a3245;border-radius:10px;cursor:pointer;color:#fff;font-weight:800;padding:6px 12px;min-width:44px;min-height:40px}
.cgrid button.sel{border-color:var(--acc)}
.cgrid .sw{width:40px;height:40px;padding:0;border-radius:50%}
#carBig{width:240px;height:144px}
input#nick{background:#141924;border:2px solid #2a3245;border-radius:10px;color:#fff;padding:9px 12px;font-size:16px;font-weight:700;text-align:center;width:220px}
.res{display:grid;grid-template-columns:auto auto auto;gap:4px 18px;background:#141924;border-radius:14px;padding:12px 18px;font-weight:700;text-align:left}
.res .me{color:var(--acc)}
.snd{display:flex;flex-direction:column;gap:10px;background:#141924;border-radius:14px;padding:14px 20px}
.snd label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
.snd input[type=range]{width:170px;accent-color:var(--acc)}
@media (max-height:820px){
 .overlay{gap:clamp(4px,1.5vh,12px);padding:clamp(6px,1.6vh,14px)}
 h1{font-size:clamp(26px,8.5vh,60px);letter-spacing:3px}
 #menu>p.intro{display:none}
 #menu .small{font-size:12px}
 h3{font-size:clamp(10px,2.4vh,14px)}
 .langs svg{width:clamp(20px,4.6vh,30px);height:auto}
 .maps{gap:5px;max-width:96vw}.map{width:clamp(84px,21vh,150px);border-width:2px}.map img{height:clamp(30px,10vh,84px)}.map div{padding:2px 6px;font-size:clamp(10px,2.4vh,13px)}
 .diff button{padding:clamp(3px,.9vh,6px) 12px}
 .garage{padding:clamp(3px,1vh,10px) 12px}.garage canvas{width:clamp(70px,17vh,120px);height:clamp(42px,10vh,72px)}
 .btn{padding:clamp(6px,1.8vh,13px) 28px;font-size:clamp(14px,3.3vh,19px)}
 #carBig{width:clamp(140px,32vh,240px);height:clamp(84px,19vh,144px)}
}
@media (max-height:520px){#menu .small{display:none}.garage .opts b{display:none}}
@media (max-height:440px){.maps{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}.map{flex:0 0 auto}}
}
@media (max-width:560px){
 h1{font-size:38px;letter-spacing:3px}
 #menu>p.intro{display:none}
 .maps{width:100%;max-width:420px}.map{width:calc(50% - 6px);box-sizing:border-box}.map img{height:44px}
 .hl .big{font-size:26px}
 #mini{width:110px;height:77px}
 .spd{font-size:22px;min-width:90px}.nitro{width:100px}
 .hb{bottom:auto;top:12px;left:auto;right:62px;transform:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div class="hl"><div class="big" id="hPos">1<small>/6</small></div><div class="mid" id="hLap"></div><div class="lo" id="hTime"></div><div class="lo" id="hBest"></div></div>
  <canvas id="mini" width="300" height="210"></canvas>
  <button id="pauseBtn">❚❚</button>
  <div class="hb"><div class="spd" id="hSpd">0 <small>km/h</small></div><div class="nitro" id="hNit"><i></i></div></div>
  <div id="msg"></div>
</div>
<div id="touch"><button id="tl">◀</button><button id="tr">▶</button><button id="tb">▼</button><button id="tg">▲</button><button id="tn">⚡</button></div>

<div class="overlay show" id="menu">

  <p class="small" id="bestMenu"></p>
</div>

<div class="overlay" id="customize">

  <canvas id="carBig" width="480" height="288"></canvas>
  <input id="nick" maxlength="16" autocomplete="off">
  <div class="ctabs" id="ctabs"></div>
  <div class="cgrid" id="cgrid"></div>

<div class="overlay" id="pause">

</div>

<div class="overlay" id="over">
  <h2 id="overTitle"></h2>
  <div class="res" id="overRes"></div>
  <p id="overInfo"></p>
  <div class="row"><button class="btn" id="againBtn" data-i="again"></button><button class="btn alt" id="menuBtn" data-i="menu"></button></div>
</div>

function buildPath(M){

  const S=[];let acc=0;S.push(dense[0]);
  for(let i=1;i<=dense.length;i++){const a=dense[i-1],b=dense[i%dense.length];let d=Math.hypot(b[0]-a[0],b[1]-a[1]);let px=a[0],py=a[1];
    while(acc+d>=10){const r=(10-acc)/d;px+= (b[0]-px)*r;py+=(b[1]-py)*r;S.push([px,py]);d=Math.hypot(b[0]-px,b[1]-py);acc=0;}acc+=d;}
  if(Math.hypot(S[S.length-1][0]-S[0][0],S[S.length-1][1]-S[0][1])<5)S.pop();
  const N=S.length;M.N=N;M.X=new Float32Array(N);M.Y=new Float32Array(N);M.TX=new Float32Array(N);M.TY=new Float32Array(N);M.ANG=new Float32Array(N);

function locate(c){const M=MAP,N=M.N;let bi=c.idx,bd=1e18;for(let k=-30;k<=30;k++){const i=(c.idx+k+N)%N,dx=M.X[i]-c.x,dy=M.Y[i]-c.y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i;}}
  if(bd>(BAR*2.2)**2){const r=nearestFull(M,c.x,c.y);bi=r[0];}return bi;}
function stepCar(c,dt,inp){
  const M=MAP,N=M.N;
  let fwd=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);
  // direction
  const sp=Math.abs(fwd),turn=inp.steer*2.75*clamp(sp/160,0,1)*(1-.28*clamp(sp/650,0,1))*(fwd>=-5?1:-1);
  c.a=wrapA(c.a+turn*dt);
  const fx=Math.cos(c.a),fy=Math.sin(c.a);
  fwd=c.vx*fx+c.vy*fy;let lat=-c.vx*fy+c.vy*fx;
  const g=M.grip*(c.off?.8:1);
  let maxS=560*(c.isP?1:c.ai.skill)*(c.off?.5:1);
  if(c.boost>0){maxS*=1.38;fwd+=420*dt;c.boost-=dt;}
  if(inp.nitro&&c.nit>.05&&c.boost<=0&&state==='race'){c.boost=.4+c.nit*1.6;c.nit=0;if(c.isP)sfx('nitro');}
  if(inp.thr>0&&fwd<maxS)fwd+=(fwd<120?620:430)*inp.thr*g*dt;
  if(inp.brk>0){if(fwd>15)fwd-=980*dt;else fwd=Math.max(-170,fwd-300*dt);}
  fwd-=fwd*(c.off?1.5:.32)*dt;if(!inp.thr&&!inp.brk)fwd-=Math.sign(fwd)*Math.min(Math.abs(fwd),70*dt);
  if(fwd>maxS)fwd+=(maxS-fwd)*Math.min(1,2.5*dt);
  const drifting=Math.abs(inp.steer)>.55&&fwd>280;
  const gl=(drifting?2.6:8.5)*g;lat*=Math.exp(-gl*dt);
  c.drift=Math.abs(lat);
  if(c.drift>75&&fwd>200&&state==='race')c.nit=Math.min(1,c.nit+c.drift*dt*.0021);
  c.vx=fx*fwd-fy*lat;c.vy=fy*fwd+fx*lat;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  // position sur la piste
  const pi=c.idx;c.idx=locate(c);
  const i=c.idx,nx=-M.TY[i],ny=M.TX[i],dx=c.x-M.X[i],dy=c.y-M.Y[i],d=dx*nx+dy*ny,ad=Math.abs(d);
  c.off=ad>RW/2+4;
  if(ad>BAR-12){const s=Math.sign(d),push=ad-(BAR-12);c.x-=nx*s*push;c.y-=ny*s*push;const vn=(c.vx*nx+c.vy*ny)*s;
    if(vn>0){c.vx-=nx*s*vn*1.4;c.vy-=ny*s*vn*1.4;c.vx*=.86;c.vy*=.86;if(c.isP&&vn>110)sfx('crash',vn);}}
  c.x=clamp(c.x,20,M.TW-20);c.y=clamp(c.y,20,M.TH-20);
  // tours
  const df=c.idx-pi;
  if(df<-N/2){c.lap++;onLap(c);}else if(df>N/2){c.lap--;}
  c.prog=c.lap*N+c.idx;
  // traces & fumée
  const rx=c.x-fx*15,ry=c.y-fy*15,ox=-fy*10,oy=fx*10;
  if(c.drift>90&&sp>150){if(c.skid){const tg=TC.getContext('2d');tg.strokeStyle=M.decor==='snow'?'rgba(70,80,95,.28)':'rgba(0,0,0,.2)';tg.lineWidth=4;tg.beginPath();
      tg.moveTo(c.skid[0],c.skid[1]);tg.lineTo(rx+ox,ry+oy);tg.moveTo(c.skid[2],c.skid[3]);tg.lineTo(rx-ox,ry-oy);tg.stroke();}
    c.skid=[rx+ox,ry+oy,rx-ox,ry-oy];if(Math.random()<.5)puff(rx+(Math.random()-.5)*16,ry+(Math.random()-.5)*16,M.decor==='snow'?'#ffffff':'#d9dde3',.6);}
  else c.skid=null;
  if(c.off&&sp>120&&Math.random()<.5)puff(rx,ry,M.dust,.5);
}
function onLap(c){
  if(state==='menu'){if(c.lap>LAPS)c.lap=1;return;}
  if(c.lap>=2){const lt=raceT-c.lapStart;if(c.best==null||lt<c.best)c.best=lt;}
  c.lapStart=raceT;
  if(c.lap>LAPS&&c.fin==null){c.fin=raceT;finishOrder.push(c);if(c.isP){sfx('finish');showMsg(t('finish'),2);overT=2.2;}}
  else if(c.isP&&c.lap>=1){if(c.lap===LAPS){showMsg(t('finalLap'),1.5);}else if(c.lap>1)showMsg(t('lap',c.lap,LAPS),1.1);if(c.lap>1)sfx('lap');}
}
function aiInput(c,dt){
  const M=MAP,N=M.N;let fwd=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);
  c.ai.offT-=dt;if(c.ai.offT<=0){c.ai.offT=1.5+Math.random()*3;c.ai.off=(Math.random()-.5)*RW*.45;}
  const look=9+Math.floor(Math.max(0,fwd)/45),ti=(c.idx+look)%N;
  const tx=M.X[ti]+(-M.TY[ti])*c.ai.off,ty=M.Y[ti]+M.TX[ti]*c.ai.off;
  const da=wrapA(Math.atan2(ty-c.y,tx-c.x)-c.a);
  let k=0;for(const s of[12,24,36]){k=Math.max(k,Math.abs(wrapA(M.ANG[(c.idx+s)%N]-M.ANG[c.idx])));}
  let skill=c.ai.skill;
  if(P&&state==='race'&&!c.isP){const gap=(c.prog-P.prog)/N;if(gap>.25)skill*=.93;else if(gap<-.25)skill*=1.06;}
  const vmax=560*skill*(M.grip<.8?.85:1),target=vmax*(1-Math.min(.58,k*.42*(M.grip<.8?1.25:1)));
  const nitro=c.nit>.5&&k<.12;
  return{steer:clamp(da*2.6,-1,1),thr:fwd<target?1:0,brk:fwd>target+70?1:0,nitro};
}
function playerInput(){
  const L=keys.ArrowLeft||keys.KeyA||keys.KeyQ||touch.l,R=keys.ArrowRight||keys.KeyD||touch.r;
  const G=keys.ArrowUp||keys.KeyW||keys.KeyZ||touch.g,B=keys.ArrowDown||keys.KeyS||touch.b;
  return{steer:(R?1:0)-(L?1:0),thr:G?1:0,brk:B?1:0,nitro:!!(keys.Space||keys.ShiftLeft||keys.ShiftRight||touch.n)};
}
function collideCars(){for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
  if(d2<26*26&&d2>.01){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(26-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const imp=-rv*.55;a.vx-=nx*imp;a.vy-=ny*imp;b.vx+=nx*imp;b.vy+=ny*imp;if((a.isP||b.isP)&&-rv>90)sfx('crash',-rv);}}}}

function update(dt){
  if(state==='pause'||state==='over'&&overT<=0)return;
  if(state==='count'){countT-=dt;const n=Math.ceil(countT-.6);if(n<lastBeep&&n>=1&&n<=3){lastBeep=n;showMsg(String(n),.7);sfx('beep');}
    if(countT<=.6&&lastBeep>0){lastBeep=0;showMsg('GO!',.9);sfx('go');state='race';raceT=0;cars.forEach(c=>c.lapStart=0);}}
  if(state==='race'||state==='menu'||state==='over'){
    if(state==='race')raceT+=dt;
    for(const c of cars){const inp=(c.isP&&state==='race'&&c.fin==null)?playerInput():aiInput(c,dt);stepCar(c,dt,inp);}
    collideCars();
  }
  if(state==='count'){for(const c of cars){c.vx*=.9;c.vy*=.9;}}
  // sens inverse
  if(state==='race'&&P){const f=Math.cos(P.a)*MAP.TX[P.idx]+Math.sin(P.a)*MAP.TY[P.idx],sp=Math.hypot(P.vx,P.vy);wrongT=(f<-.35&&sp>60)?wrongT+dt:0;if(wrongT>1.2&&msgT<=0)showMsg(t('wrongWay'),1);}
  if(overT>0){overT-=dt;if(overT<=0)showResults();}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').classList.remove('on');}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.r+=dt*28;if(p.t>p.life)parts.splice(i,1);}
  // caméra
  const lx=P.x+P.vx*.32,ly=P.y+P.vy*.32,k=Math.min(1,dt*5);cam.x+=(lx-cam.x)*k;cam.y+=(ly-cam.y)*k;
  // son moteur
  if(AC){const fwd=P.vx*Math.cos(P.a)+P.vy*Math.sin(P.a);const inp=state==='race'?playerInput():{thr:0};engineSet(fwd,inp.thr||0,P.drift,state==='race'||state==='count');}
}
function render(){
  const z=clamp(Math.min(W,H)/580,.64,1.15);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=MAP.ground;ctx.fillRect(0,0,W,H);
  const vw=W/z,vh=H/z,x0=cam.x-vw/2,y0=cam.y-vh/2;
  ctx.setTransform(DPR*z,0,0,DPR*z,-x0*DPR*z,-y0*DPR*z);
  const sx=Math.max(0,Math.floor(x0)),sy=Math.max(0,Math.floor(y0)),ex=Math.min(MAP.TW,Math.ceil(x0+vw)),ey=Math.min(MAP.TH,Math.ceil(y0+vh));
  if(ex>sx&&ey>sy)ctx.drawImage(TC,sx,sy,ex-sx,ey-sy,sx,sy,ex-sx,ey-sy);
  for(const p of parts){ctx.globalAlpha=p.a*(1-p.t/p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  for(const c of cars){if(c.x<x0-60||c.x>x0+vw+60||c.y<y0-60||c.y>y0+vh+60)continue;
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
    ctx.drawImage(SHADOW,-SPW/2+3,-SPH/2+4,SPW,SPH);
    if(c.boost>0){ctx.globalCompositeOperation='lighter';ctx.drawImage(FLAME,-CL/2-38+Math.random()*4,-8,40,16);ctx.globalCompositeOperation='source-over';}
    ctx.drawImage(c.spr,-SPW/2,-SPH/2,SPW,SPH);ctx.restore();}
  if(MAP.night){
    ctx.setTransform(DPR,0,0,DPR,0,0);const px=(P.x-x0)*z,py=(P.y-y0)*z,gr=ctx.createRadialGradient(px,py,90*z,px,py,Math.max(W,H)*.75);
    gr.addColorStop(0,'rgba(4,6,20,.25)');gr.addColorStop(1,'rgba(4,6,20,.86)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.setTransform(DPR*z,0,0,DPR*z,-x0*DPR*z,-y0*DPR*z);ctx.globalCompositeOperation='lighter';
    for(const[lx,ly]of LAMPS){if(lx<x0-100||lx>x0+vw+100||ly<y0-100||ly>y0+vh+100)continue;ctx.drawImage(GLOW,lx-110,ly-110,220,220);}
    for(const c of cars){if(c.x<x0-300||c.x>x0+vw+300||c.y<y0-300||c.y>y0+vh+300)continue;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.drawImage(LIGHT,CL/2-4,-75,240,150);ctx.restore();}
    ctx.globalCompositeOperation='source-over';
  }
}

$('volS').value=Math.round(vol.s*100);$('volM').value=Math.round(vol.m*100);
$('volS').oninput=e=>{vol.s=e.target.value/100;applyVol();sfx('pick');};
$('volM').oninput=e=>{vol.m=e.target.value/100;if(musG&&AC)musG.gain.cancelScheduledValues(AC.currentTime);applyVol();};
$('muteChk').onchange=e=>{audioInit();setMute(e.target.checked);};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(state==='menu'&&e.code==='Enter'&&$('menu').classList.contains('show'))startRace();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='race'||state==='count')togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='race'||state==='count'))togglePause();});
for(const[id,k]of[['tl','l'],['tr','r'],['tg','g'],['tb','b'],['tn','n']]){const b=$(id);
  const on=e=>{e.preventDefault();touch[k]=1;b.classList.add('on');audioInit();},off=e=>{e.preventDefault();touch[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);}

resize();setMute(muted);setMap(custom.map);refreshCustom();applyLang();
requestAnimationFrame(frame);
</script></body></html>
