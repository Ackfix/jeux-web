canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:safe center;background:rgba(8,9,16,.66);flex-direction:column;gap:14px;padding:18px;text-align:center;box-sizing:border-box;overflow:auto;z-index:6}
.overlay.show{display:flex}
h1{margin:0;font-size:clamp(44px,9vw,80px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#7cf06a,#2fd3e0,#b06cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #11162a)}
h2{margin:0;font-size:36px;font-weight:900;color:#7cf06a}
h3{margin:0;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
p{margin:0;max-width:560px;line-height:1.45;color:#cfd6e4}
.small{font-size:13px;opacity:.65}
.btn{background:#7cf06a;color:#0c2a08;border:0;border-radius:14px;padding:13px 44px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #3a9a2e}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3a9a2e}
.btn.alt{background:#1f2538;color:#eef2f8;box-shadow:0 4px 0 #11152a}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.55}
.langs button.sel{border-color:#7cf06a;opacity:1}
.langs svg{border-radius:2px;display:block}
.maps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px}
.map{width:110px;border-radius:12px;border:3px solid transparent;cursor:pointer;overflow:hidden;background:#161b2b}
.map.sel{border-color:#7cf06a}
.map img{display:block;width:100%;height:58px;object-fit:cover}
.map div{padding:4px 8px;font-weight:800;font-size:12px;text-align:left}
.diff{display:flex;gap:6px}
.diff button{background:#161b2b;color:#cfd6e4;border:2px solid #2a3150;border-radius:9px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:13px}
.diff button.sel{border-color:#7cf06a;color:#fff;background:#18301a}
.garage{display:flex;gap:16px;align-items:center;background:#161b2b;border-radius:16px;padding:10px 18px}

.garage .opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
input#nick,input#nick2{background:#161b2b;border:2px solid #2a3150;border-radius:10px;color:#fff;padding:9px 12px;font-size:16px;font-weight:700;text-align:center;width:220px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none;font-weight:800;text-shadow:0 2px 3px rgba(0,0,0,.8)}
#hud.on{display:block}
#hLen{position:absolute;left:14px;top:12px;font-size:22px}
#hLen small{display:block;font-size:13px;opacity:.75}
#lb{position:absolute;right:12px;top:56px;font-size:13px;background:rgba(10,12,22,.55);border-radius:10px;padding:8px 10px;min-width:150px}
#lb div{display:flex;justify-content:space-between;gap:10px;opacity:.85}
#lb div.me{color:#7cf06a;opacity:1}
#lb b{display:block;text-align:center;font-size:12px;letter-spacing:1px;opacity:.7;margin-bottom:3px}
#mini{position:absolute;right:12px;bottom:12px;width:110px;height:110px}
#pauseBtn{position:absolute;right:12px;top:10px;pointer-events:auto;background:rgba(22,27,43,.85);color:#fff;border:0;border-radius:10px;width:40px;height:38px;font-size:16px;cursor:pointer}
#boostBtn{position:absolute;left:18px;bottom:22px;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(15,18,28,.45);color:#fff;font-size:30px;pointer-events:auto;display:none;touch-action:none}
#boostBtn.on{background:rgba(124,240,106,.45)}
#hud.touch #boostBtn{display:block}
#hud.touch #mini{bottom:auto;top:56px;left:12px;right:auto;width:80px;height:80px}
#msg{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:clamp(28px,6vw,56px);font-weight:900;color:#7cf06a;text-shadow:0 3px 0 #0c2a08,0 0 24px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#msg.on{opacity:1}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ctabs button{background:#161b2b;color:#cfd6e4;border:0;border-radius:9px;padding:7px 14px;font-weight:800;cursor:pointer}
.ctabs button.sel{background:#7cf06a;color:#0c2a08}
.cgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px;min-height:60px}
.cgrid button{background:#161b2b;border:2px solid #2a3150;border-radius:10px;cursor:pointer;color:#fff;font-weight:800;padding:6px 12px;min-width:44px;min-height:40px}
.cgrid button.sel{border-color:#7cf06a}
.cgrid .sw{width:40px;height:40px;padding:0;border-radius:50%}
#bigPrev{width:320px;height:160px}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 20px;background:#161b2b;border-radius:14px;padding:12px 20px;font-weight:700;text-align:left}
.stats b{color:#7cf06a;text-align:right}
.snd{display:flex;flex-direction:column;gap:10px;background:#161b2b;border-radius:14px;padding:14px 20px}
.snd label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
.snd input[type=range]{width:170px;accent-color:#7cf06a}

@media (max-width:560px){
 h1{font-size:40px;letter-spacing:2px}
 #menu>p.intro{display:none}

function spawnBot(){let x,y,ok=false;for(let k=0;k<20&&!ok;k++){[x,y]=randInArena(300);ok=!P||P.dead||(x-P.x)**2+(y-P.y)**2>700*700;}
  const o={col:(Math.random()*COLORS.length)|0,col2:(Math.random()*COLORS.length)|0,pat:(Math.random()*5)|0,eyes:(Math.random()*4)|0};
  const sc=[[10,60],[10,140],[20,260]][custom.diff];const s=newSnake(o,BOTNAMES[(Math.random()*BOTNAMES.length)|0],false,sc[0]+Math.random()*Math.random()*sc[1]*4,x,y);
  s.ai.aggr=[.08,.25,.5][custom.diff]*(0.5+Math.random());snakes.push(s);}
function setupWorld(withPlayer){snakes=[];foods=[];fgrid=new Array(GN*GN);kills=0;bestRank=99;lastRank=99;T=0;deadT=0;
  for(let i=0;i<1400;i++){const[x,y]=randInArena(40);addFood(x,y,1+Math.random()*1.5);}
  P=null;if(withPlayer){P=newSnake(custom,custom.name||t('you'),true,10,0,0);snakes.push(P);}
  const nb=[16,22,28][custom.diff];for(let i=0;i<nb;i++)spawnBot();
  if(!P){P=snakes[0];}cam.x=P.x;cam.y=P.y;}

/* ================= SIMULATION ================= */
let SG=[];
function buildSegGrid(){SG=new Array(GN*GN);for(let si=0;si<snakes.length;si++){const s=snakes[si];if(s.dead)continue;const st=Math.max(1,Math.floor(radOf(s)*.5/spacing(s)));
  for(let i=3;i<s.pts.length;i+=st){const p=s.pts[i],c=cellOf(p[0],p[1]);(SG[c]||(SG[c]=[])).push(s,p[0],p[1]);}}}
function danger(s,x,y,rad){const cx=Math.floor((x+R0)/CELL),cy=Math.floor((y+R0)/CELL);let d=0;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=SG[clamp(cx+i,0,GN-1)+clamp(cy+j,0,GN-1)*GN];if(!a)continue;for(let k=0;k<a.length;k+=3){if(a[k]===s)continue;const dx=a[k+1]-x,dy=a[k+2]-y;if(dx*dx+dy*dy<rad*rad)d++;}}
  if(x*x+y*y>(R0-60)**2)d+=5;return d;}
function botThink(s,dt){const ai=s.ai,r=radOf(s);ai.t-=dt;
  // évitement
  const look=60+r*3,sides=[0,-.55,.55,-1.1,1.1,-1.7,1.7];let best=null;
  const d0=danger(s,s.x+Math.cos(s.a)*look,s.y+Math.sin(s.a)*look,r*2.2)+danger(s,s.x+Math.cos(s.a)*look*.5,s.y+Math.sin(s.a)*look*.5,r*2);
  if(d0>0){let bd=1e9;for(const off of sides){const a=s.a+off,d=danger(s,s.x+Math.cos(a)*look,s.y+Math.sin(a)*look,r*2.2)+Math.abs(off)*.3;if(d<bd){bd=d;best=a;}}s.ta=best;s.boost=s.score>60&&Math.random()<.02;return;}
  if(ai.t<=0){ai.t=.4+Math.random()*.6;
    // attaque : couper la route du joueur
    if(P&&!P.dead&&P!==s&&Math.random()<ai.aggr&&s.score>P.score*.5){const dx=P.x-s.x,dy=P.y-s.y;if(dx*dx+dy*dy<500*500){ai.mode='atk';ai.tx=P.x+Math.cos(P.a)*(140+radOf(P)*4);ai.ty=P.y+Math.sin(P.a)*(140+radOf(P)*4);}else ai.mode='food';}
    else ai.mode='food';
    if(ai.mode==='food'){let bv=0,bx=0,by=0;const cx=Math.floor((s.x+R0)/CELL),cy=Math.floor((s.y+R0)/CELL);
      for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){const a=fgrid[clamp(cx+i,0,GN-1)+clamp(cy+j,0,GN-1)*GN];if(!a)continue;for(const f of a){const d=Math.hypot(f.x-s.x,f.y-s.y)+30;const v=f.v/d;if(v>bv){bv=v;bx=f.x;by=f.y;}}}
      if(bv>0){ai.tx=bx;ai.ty=by;}else{const[x,y]=randInArena(400);ai.tx=x;ai.ty=y;}}
    s.boost=ai.mode==='atk'&&s.score>40;}
  s.ta=Math.atan2(ai.ty-s.y,ai.tx-s.x);}
function moveSnake(s,dt){const r=radOf(s);
  const turn=(4.2-Math.min(2,r*.05))*dt;const da=wrapA(s.ta-s.a);s.a+=clamp(da,-turn,turn);
  const boosting=s.boost&&s.score>15;const sp=boosting?360:175;
  s.x+=Math.cos(s.a)*sp*dt;s.y+=Math.sin(s.a)*sp*dt;
  if(boosting){s.score-=dt*7;s.dropT-=dt;if(s.dropT<=0){s.dropT=.09;const tp=s.pts[s.pts.length-1];addFood(tp[0]+(Math.random()-.5)*8,tp[1]+(Math.random()-.5)*8,1.2,s.skin.col);}if(s.isP)sfx('boost');}
  // corps
  const pts=s.pts,spc=spacing(s);pts[0][0]=s.x;pts[0][1]=s.y;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=a[0]-b[0],dy=a[1]-b[1],d=Math.hypot(dx,dy);if(d>spc){const k=(d-spc)/d;b[0]+=dx*k;b[1]+=dy*k;}}
  const n=segCount(s);while(pts.length<n){const l=pts[pts.length-1];pts.push([l[0],l[1]]);}while(pts.length>n)pts.pop();
  // manger
  const cx=Math.floor((s.x+R0)/CELL),cy=Math.floor((s.y+R0)/CELL),er=r+10,mr=r*2.4+40;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=fgrid[clamp(cx+i,0,GN-1)+clamp(cy+j,0,GN-1)*GN];if(!a)continue;
    for(let k=a.length-1;k>=0;k--){const f=a[k],dx=s.x-f.x,dy=s.y-f.y,d2=dx*dx+dy*dy;
      if(d2<er*er){s.score+=f.v;removeFood(f);if(s.isP){f.v>3?sfx('big'):sfx('eat');}}
      else if(d2<mr*mr){const d=Math.sqrt(d2),m=Math.min(d,260*dt);f.x+=dx/d*m;f.y+=dy/d*m;}}}
}
function kill(s,by){if(s.dead)return;s.dead=true;const step=Math.max(1,Math.floor(s.pts.length/120)),per=Math.max(1,s.score*.7/(s.pts.length/step));
  for(let i=0;i<s.pts.length;i+=step){const p=s.pts[i];addFood(p[0]+(Math.random()-.5)*14,p[1]+(Math.random()-.5)*14,per,i%2?s.skin.col:COLORS[s.o.col2]);}
  if(by){by.kills++;if(by.isP){kills++;sfx('kill');showMsg(t('killMsg'),1);}}
  if(s.isP){deathMsg=by?t('eatenBy',by.name):t('wall');deadT=1.3;sfx('die');}}
function collide(){for(const s of snakes){if(s.dead)continue;const r=radOf(s);
  if(s.x*s.x+s.y*s.y>(R0-r)**2){kill(s,null);continue;}
  const cx=Math.floor((s.x+R0)/CELL),cy=Math.floor((s.y+R0)/CELL);
  outer:for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=SG[clamp(cx+i,0,GN-1)+clamp(cy+j,0,GN-1)*GN];if(!a)continue;
    for(let k=0;k<a.length;k+=3){const o=a[k];if(o===s||o.dead)continue;const ro=radOf(o),dx=a[k+1]-s.x,dy=a[k+2]-s.y,rr=r*.75+ro*.85;if(dx*dx+dy*dy<rr*rr){kill(s,o);break outer;}}}}}
let foodT=0;
function step(dt){T+=dt;buildSegGrid();
  for(const s of snakes){if(s.dead)continue;if(s.isP&&state==='play'){s.ta=Math.atan2(input.ay,input.ax);s.boost=input.boost;}else botThink(s,dt);moveSnake(s,dt);}
  collide();
  snakes=snakes.filter(s=>!s.dead||s.isP);
  const nb=[16,22,28][custom.diff];while(snakes.filter(s=>!s.isP).length<nb)spawnBot();
  foodT-=dt;if(foodT<=0){foodT=.05;if(foods.length<1700){const[x,y]=randInArena(40);addFood(x,y,1+Math.random()*1.5);}if(foods.length>3000)foods=foods.filter(f=>!f.dead);}
  if(Math.random()<.02)foods=foods.filter(f=>!f.dead);
  if(state==='menu'&&P.dead){P=snakes.find(s=>!s.dead)||P;}
}
function update(dt){if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').classList.remove('on');}
  if(state==='pause'||state==='over')return;
  step(dt);
  if(state==='play'){if(P.dead){deadT-=dt;if(deadT<=0)gameOver();}else{const rk=rankOf(P);if(rk<bestRank)bestRank=rk;if(rk===1&&lastRank!==1){showMsg(t('first'),1.4);sfx('rank');}lastRank=rk;}}
  const tx=P.x,ty=P.y,k=Math.min(1,dt*6);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  const zt=clamp(1.05-radOf(P)*.014,.55,1)*clamp(Math.min(W,H)/700,.62,1.2);cam.z+=(zt-cam.z)*Math.min(1,dt*2);}
function rankOf(s){let r=1;for(const o of snakes)if(!o.dead&&o!==s&&o.score>s.score)r++;return r;}
function lenOf(s){return Math.floor(s.score*10);}

/* ================= RENDU ================= */
function render(){const z=cam.z,vw=W/z,vh=H/z,x0=cam.x-vw/2,y0=cam.y-vh/2;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*z,0,0,DPR*z,-x0*DPR*z,-y0*DPR*z);
  // sol
  ctx.save();ctx.beginPath();ctx.arc(0,0,R0,0,TAU);ctx.clip();ctx.fillStyle=ctx.createPattern(TILE,'repeat');ctx.fillRect(x0,y0,vw,vh);ctx.restore();
  ctx.strokeStyle=ARENA.edge;ctx.lineWidth=24;ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(0,0,R0+12,0,TAU);ctx.stroke();ctx.globalAlpha=1;
  // nourriture
  const pad=40;for(const f of foods){if(f.dead||f.x<x0-pad||f.x>x0+vw+pad||f.y<y0-pad||f.y>y0+vh+pad)continue;const s=(7+f.v*3.2)*(1+.12*Math.sin(T*4+f.ph));ctx.drawImage(glowSpr(f.col),f.x-s,f.y-s,s*2,s*2);}
  // serpents (les plus petits dessous)
  const vis=snakes.filter(s=>!s.dead).sort((a,b)=>a.score-b.score);
  for(const s of vis)drawSnake(s,x0,y0,vw,vh);
  // noms
  ctx.textAlign='center';ctx.font='800 13px system-ui,sans-serif';
  for(const s of vis){if(s.x<x0||s.x>x0+vw||s.y<y0||s.y>y0+vh)continue;const r=radOf(s);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(s.name,s.x+1,s.y-r-9);ctx.fillStyle=s.isP?'#fff':'rgba(255,255,255,.75)';ctx.fillText(s.name,s.x,s.y-r-10);}
}
function drawSnake(s,x0,y0,vw,vh){const r=radOf(s),sk=s.skin,pts=s.pts,n=pts.length,pad=r+10;
  if(s.boost&&s.score>15){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.25;for(let i=n-1;i>=0;i-=3){const p=pts[i];if(p[0]<x0-pad||p[0]>x0+vw+pad||p[1]<y0-pad||p[1]>y0+vh+pad)continue;ctx.drawImage(glowSpr(sk.col),p[0]-r*1.8,p[1]-r*1.8,r*3.6,r*3.6);}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  for(let i=n-1;i>=0;i--){const p=pts[i];if(p[0]<x0-pad||p[0]>x0+vw+pad||p[1]<y0-pad||p[1]>y0+vh+pad)continue;
    let img;const pt=sk.pat;if(pt===0)img=sk.A;else if(pt===1)img=((i/4)|0)%2?sk.B:sk.A;else if(pt===2)img=i%5===0?sk.D:sk.A;else if(pt===3)img=i%7<2?sk.B:sk.A;else img=sk.fade[Math.floor(i/n*7.99)];
    const rr=i===0?r*1.08:r*(1-Math.max(0,(i-n*.8)/(n*.2))*.45);ctx.drawImage(img,p[0]-rr,p[1]-rr,rr*2,rr*2);}
  // yeux
  const a=s.a,ex=Math.cos(a),ey=Math.sin(a),px=-ey,py=ex,er=r*.38;
  for(const sd of[-1,1]){const x=s.x+ex*r*.35+px*sd*r*.45,y=s.y+ey*r*.35+py*sd*r*.45;
    if(sk.eyes===3){ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(x,y,er*1.15,er*.9,a,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(x-er*.3,y-er*.3,er*.25,0,TAU);ctx.fill();continue;}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,er*(sk.eyes===2?1.15:1),0,TAU);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+ex*er*.35,y+ey*er*.35,er*(sk.eyes===2?.62:.5),0,TAU);ctx.fill();
    if(sk.eyes===2){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+ex*er*.15-ey*er*.2,y+ey*er*.15+ex*er*.2,er*.2,0,TAU);ctx.fill();}
    if(sk.eyes===1){ctx.strokeStyle='#111';ctx.lineWidth=r*.16;ctx.beginPath();ctx.moveTo(x-px*sd*er*1.1-ex*er*.6,y-py*sd*er*1.1-ey*er*.6);ctx.lineTo(x+px*sd*er*.6+ex*er*.9,y+py*sd*er*.6+ey*er*.9);ctx.stroke();}}
  if(sk.eyes===3){ctx.strokeStyle='#111';ctx.lineWidth=r*.12;ctx.beginPath();ctx.moveTo(s.x+ex*r*.35+px*r*.45,s.y+ey*r*.35+py*r*.45);ctx.lineTo(s.x+ex*r*.35-px*r*.45,s.y+ey*r*.35-py*r*.45);ctx.stroke();}
}
let hudT=0;
function updHud(){if(state!=='play')return;const alive=snakes.filter(s=>!s.dead),rk=P.dead?'-':rankOf(P);

  if(custom.name){g.fillStyle='#fff';g.font='800 '+Math.round(h*.11)+'px system-ui,sans-serif';g.textAlign='center';g.fillText(custom.name,s.x,s.y-r-h*.06);}}
let ctab=0;
const CTABS=[['tCol',()=>COLORS.map((c,i)=>`<button class="sw ${custom.col===i?'sel':''}" style="background:${c}" data-k="col" data-v="${i}"></button>`).join('')],
 ['tCol2',()=>COLORS.map((c,i)=>`<button class="sw ${custom.col2===i?'sel':''}" style="background:${c}" data-k="col2" data-v="${i}"></button>`).join('')],
 ['tPat',()=>PATS.map((k,i)=>`<button data-k="pat" data-v="${i}" class="${custom.pat===i?'sel':''}">${t(k)}</button>`).join('')],
 ['tEyes',()=>EYES.map((k,i)=>`<button data-k="eyes" data-v="${i}" class="${custom.eyes===i?'sel':''}">${t(k)}</button>`).join('')]];
function renderCustom(){$('ctabs').innerHTML=CTABS.map(([k],i)=>`<button data-t="${i}" class="${i===ctab?'sel':''}">${t(k)}</button>`).join('');$('cgrid').innerHTML=CTABS[ctab][1]();drawPrev($('bigPrev'));}
function refreshCustom(){drawPrev($('prev'));if($('customize').classList.contains('show'))renderCustom();saveCustom();}
function arenaPrev(A){const keep=ARENA;ARENA=A;makeTile();const c=mk(220,116,g=>{g.fillStyle=g.createPattern(TILE,'repeat');g.fillRect(0,0,220,116);
  const cols=[COLORS[0],COLORS[1],COLORS[3],COLORS[4]];for(let i=0;i<14;i++){const gl=glowSpr(cols[i%4]);g.drawImage(gl,(i*37)%210,(i*53)%100,18,18);}
  g.strokeStyle=A.edge;g.lineWidth=8;g.beginPath();g.arc(110,330,280,0,TAU);g.stroke();}).toDataURL();ARENA=keep;makeTile();return c;}
const AIMG=ARENAS.map(arenaPrev);
function renderMaps(){$('maps').innerHTML=ARENAS.map((A,i)=>`<div class="map ${i===custom.arena?'sel':''}" data-m="${i}"><img src="${AIMG[i]}" alt=""><div>${t(A.k)}</div></div>`).join('');}
function renderDiff(){$('diff').innerHTML=['easy','normal','hard'].map((k,i)=>`<button data-d="${i}" class="${custom.diff===i?'sel':''}">${t(k)}</button>`).join('');}
function applyLang(){document.documentElement.lang=LANGS[LI][0];document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  $('nick').placeholder=t('nickPh');$('nick').value=custom.name||'';
  $('langs').innerHTML=LANGS.map(([c,n],i)=>'<button class="'+(i===LI?'sel':'')+'" data-l="'+i+'" title="'+n+'">'+flagSVG(c)+'</button>').join('');
  renderMaps();renderDiff();showBest();if($('customize').classList.contains('show'))renderCustom();}
function setArena(i){ARENA=ARENAS[i]||ARENAS[0];custom.arena=ARENAS.indexOf(ARENA);saveCustom();makeTile();renderMaps();}
$('langs').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;LI=+b.dataset.l;try{localStorage.setItem('sn_lang',LI);}catch(_){}applyLang();sfx('pick');});
$('maps').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;audioInit();setArena(+b.dataset.m);sfx('pick');});
$('diff').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;custom.diff=+b.dataset.d;saveCustom();renderDiff();sfx('pick');});
$('ctabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;ctab=+b.dataset.t;renderCustom();sfx('pick');});
$('cgrid').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;custom[b.dataset.k]=+b.dataset.v;refreshCustom();sfx('pick');});
$('custBtn').onclick=()=>{audioInit();$('menu').classList.remove('show');$('customize').classList.add('show');renderCustom();sfx('pick');};
$('okBtn').onclick=()=>{$('customize').classList.remove('show');$('menu').classList.add('show');sfx('pick');};
$('randBtn').onclick=()=>{const r=n=>(Math.random()*n)|0;custom.col=r(COLORS.length);custom.col2=r(COLORS.length);custom.pat=r(5);custom.eyes=r(4);refreshCustom();sfx('pick');};
$('nick').addEventListener('input',e=>{custom.name=cleanName(e.target.value);saveCustom();drawPrev($('prev'));});
$('menu').addEventListener('pointerdown',()=>audioInit());
$('playBtn').onclick=startGame;$('againBtn').onclick=startGame;$('menuBtn').onclick=toMenu;$('quitBtn').onclick=toMenu;
$('resumeBtn').onclick=togglePause;$('pauseBtn').onclick=togglePause;
$('volS').value=Math.round(vol.s*100);$('volM').value=Math.round(vol.m*100);
$('volS').oninput=e=>{vol.s=e.target.value/100;applyVol();sfx('pick');};
$('volM').oninput=e=>{vol.m=e.target.value/100;if(musG&&AC)musG.gain.cancelScheduledValues(AC.currentTime);applyVol();};
$('muteChk').onchange=e=>{audioInit();setMute(e.target.checked);};

let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;
  if(state==='play'&&keyTurn&&P&&!P.dead){const a=Math.atan2(input.ay,input.ax)+keyTurn*3.2*dt;input.ax=Math.cos(a);input.ay=Math.sin(a);}
  if(P&&!P.dead)P.maxScore=Math.max(P.maxScore||0,P.score);
  update(dt);render();hudT-=dt;if(hudT<=0){hudT=.2;updHud();}if(AC&&!muted)musicTick();requestAnimationFrame(frame);}
setMute(muted);resize();ARENA=ARENAS[custom.arena]||ARENAS[0];makeTile();setupWorld(false);applyLang();drawPrev($('prev'));
requestAnimationFrame(frame);
</script></body></html>
