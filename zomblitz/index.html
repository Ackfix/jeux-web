<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zomblitz</title>
<style>
html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef1f6;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
#hud.hide{display:none}
.xpbar{position:absolute;top:0;left:0;right:0;height:10px;background:rgba(0,0,0,.45)}
#xpfill{height:100%;width:0;background:var(--acc,#4fd1c5)}
#lvl{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-weight:800;font-size:13px;letter-spacing:1px;text-shadow:0 1px 3px #000}
.top{position:absolute;top:30px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;font-weight:700;font-size:15px;text-shadow:0 1px 3px #000}
.top .c{text-align:center;font-size:22px}
.small{font-size:12px;font-weight:600;opacity:.85}
#inv{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:70vw}
#inv span{background:rgba(10,12,18,.8);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:4px 7px;font-size:13px;font-weight:700}
.btns{position:absolute;top:28px;right:14px;display:flex;gap:6px;pointer-events:auto}
.btns button{background:rgba(10,12,18,.8);border:1px solid rgba(255,255,255,.15);color:#eef1f6;border-radius:8px;font-size:15px;width:36px;height:32px;cursor:pointer}
#kills{margin-right:46px;text-align:right}
#bossbar{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:min(460px,80vw);display:none;text-align:center}
#bossname{font-weight:900;font-size:14px;letter-spacing:1px;color:#ff8a8a;text-shadow:0 1px 3px #000;margin-bottom:4px}
.bb{height:10px;background:rgba(40,8,12,.85);border:1px solid #6a1f28;border-radius:6px;overflow:hidden}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#ff9a5a)}
#banner{position:fixed;top:26%;left:0;right:0;text-align:center;font-size:clamp(26px,6vw,46px);font-weight:900;color:#ff5c5c;text-shadow:0 3px 14px #000;opacity:0;pointer-events:none;letter-spacing:2px;padding:0 12px}
#banner.go{animation:ban 2.6s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,10,.8);flex-direction:column;gap:14px;padding:20px;text-align:center;box-sizing:border-box;overflow:auto}
.overlay.show{display:flex}

#menu{justify-content:flex-start;padding-top:16px;gap:10px}
h1{margin:0;font-size:clamp(44px,9vw,76px);font-weight:900;letter-spacing:8px;color:var(--acc,#4fd1c5);text-shadow:0 0 28px var(--accG,rgba(80,210,200,.4))}
h2{margin:0;font-size:28px;font-weight:900}
h3{margin:6px 0 0;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75}
p{margin:0;max-width:560px;line-height:1.5;color:#c6ccd8}
.btn{background:var(--acc,#4fd1c5);color:#0b0d12;border:0;border-radius:12px;padding:14px 40px;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:1px}
.btn.alt{background:#232a38;color:#eef1f6}
.btn:hover{filter:brightness(1.1)}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:200px;background:#141924;border:2px solid #262f42;border-radius:14px;padding:14px;cursor:pointer;text-align:left;transition:transform .1s,border-color .1s;box-sizing:border-box}
.card:hover{transform:translateY(-4px);border-color:var(--acc,#4fd1c5)}
.card .ic{font-size:30px}
.card .tt{font-weight:800;font-size:17px;margin:6px 0 2px}
.card .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#26324a;color:#90cdf4;margin-bottom:8px}
.card .tag.new{background:#3d3416;color:#ffd36e}
.card .ds{font-size:14px;color:#b8c1d1;line-height:1.4}
.card .k{float:right;font-size:12px;opacity:.5;font-weight:800}
.themes{display:flex;gap:8px;max-width:720px;flex-wrap:wrap;justify-content:center}
.theme{width:128px;border-radius:14px;border:3px solid transparent;cursor:pointer;overflow:hidden;background:#141924;transition:transform .1s}
.theme:hover{transform:translateY(-3px)}
.theme.sel{border-color:var(--acc,#4fd1c5)}
.theme img{display:block;width:100%;height:60px;object-fit:cover}
.theme div{padding:6px 8px;font-weight:800;font-size:13px;text-align:left}
.theme small{display:none;font-weight:600;font-size:12px;opacity:.7;margin-top:2px}
.custom{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;background:#141924;border-radius:16px;padding:12px 18px}
#heroPrev{width:96px;height:96px}
.cwrap{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap;justify-content:center;max-width:860px;width:100%}
.cleft{display:flex;flex-direction:column;align-items:center;gap:12px;background:#141924;border-radius:18px;padding:18px}
.cleft canvas{width:190px;height:190px;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);border-radius:50%}
.nickl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.9;width:190px}
.nickl input{background:#0d1118;border:2px solid #2a3245;border-radius:10px;color:#eef1f6;font-size:16px;font-weight:700;padding:9px 12px;text-transform:none;letter-spacing:0;outline:none}
.nickl input:focus{border-color:var(--acc)}
.small2{padding:9px 18px;font-size:15px}
.cright{flex:1;min-width:300px;background:#141924;border-radius:18px;padding:14px;text-align:left}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ctabs button{background:#232a38;color:#eef1f6;border:0;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:800;cursor:pointer}
.ctabs button.sel{background:var(--acc);color:#0b0d12}
.csec{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.65;margin:10px 0 8px}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{width:84px;background:#1d2330;border:3px solid transparent;border-radius:12px;cursor:pointer;text-align:center;padding:4px 2px 6px;font-size:12px;font-weight:700}
.tile img{width:64px;height:64px;display:block;margin:0 auto}
.tile.sel{border-color:var(--acc)}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sws button{width:40px;height:40px;border-radius:50%;border:4px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.sws button.sel{border-color:#fff}
.card.cevo{border-color:#ffd23a;box-shadow:0 0 18px rgba(255,210,58,.35)}
.card .tag.evo{background:#5a4a10;color:#ffd23a}
.cpanel{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center;background:#141924;border-radius:18px;padding:18px 22px}
#heroBig{width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%}
.crows{display:flex;flex-direction:column;gap:10px;text-align:left}
.crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crow>span{width:92px;font-weight:800;font-size:14px;opacity:.85}
.opts{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sw{display:flex;gap:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw button.sel{border-color:#fff}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.acc button{background:#232a38;color:#eef1f6;border:2px solid transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.acc button.sel{border-color:var(--acc,#4fd1c5)}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 24px;font-size:17px;text-align:left}
.stats b{color:#fff}
.snd{display:flex;flex-direction:column;gap:12px;background:#141924;border-radius:14px;padding:16px 22px;font-weight:700;text-align:left}
.snd label{display:flex;align-items:center;gap:12px;justify-content:space-between}
.snd input[type=range]{width:180px;accent-color:var(--acc)}
.snd .chk{justify-content:flex-start;font-weight:600;font-size:14px}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.55;transition:opacity .1s}
.langs button:hover{opacity:.9}
.langs button.sel{border-color:var(--acc);opacity:1}
.langs svg{border-radius:2px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.overlay{justify-content:safe center}
@media (max-height:640px){
 #menu{gap:clamp(5px,1.8vh,14px);padding:clamp(6px,2vh,16px)}
 #menu h1{font-size:clamp(28px,9vh,56px);letter-spacing:4px}
 #menu>p[data-i="intro"]{display:none}
 #menu .small{font-size:12px}
 #menu h3{margin:0;font-size:clamp(11px,2.6vh,15px)}
 .themes{max-width:96vw;gap:clamp(4px,1.2vh,8px)}
 .themes .theme{width:clamp(86px,24vh,128px);border-width:2px;border-radius:10px}
 .themes .theme img{height:clamp(30px,12vh,60px)}
 .themes .theme div{padding:3px 6px;font-size:clamp(10px,2.6vh,13px)}
 .custom{padding:clamp(4px,1.4vh,12px) 14px;gap:12px}
 #heroPrev{width:clamp(46px,15vh,96px);height:clamp(46px,15vh,96px)}
 #menu .btn{padding:clamp(7px,2vh,14px) 30px;font-size:clamp(15px,3.6vh,19px)}
}
@media (max-height:520px){#menu .small{display:none}}
}
@media (max-height:440px){.themes{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:96vw}.theme{flex:0 0 auto}}
@media (max-width:560px){
 #menu{gap:8px;padding:12px 8px}
 #menu h1{font-size:36px;letter-spacing:4px}
 #menu>p[data-i="intro"]{display:none}
 #menu h3{margin:0;font-size:13px}
 .themes{gap:5px}
 .themes .theme{width:calc(33% - 6px);border-width:2px;border-radius:10px}
 .themes .theme img{height:38px}
 .themes .theme div{padding:3px 5px;font-size:11px}
 .custom{padding:6px 12px;gap:10px}
 #heroPrev{width:56px;height:56px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div class="xpbar"><div id="xpfill"></div></div>
  <div id="lvl">NIV. 1</div>
  <div class="top">
    <div id="hp">❤️ 100 / 100</div>
    <div class="c"><div id="time">0:00</div><div class="small" id="horde">Boss dans 2:30</div><div class="small" id="horde2"></div></div>
    <div id="kills">💀 0</div>
  </div>
  <div class="btns"><button id="pauseBtn" title="Pause">⏸</button></div>
  <div id="bossbar"><div id="bossname"></div><div class="bb"><div id="bossfill"></div></div></div>
  <div id="inv"></div>
</div>
<div id="banner"></div>

<div class="overlay show" id="menu">
  <h1>ZOMBLITZ</h1>
  <div class="langs" id="langs"></div>
  <p data-i="intro"></p>
  <h3 data-i="chooseMap"></h3>
  <div class="themes" id="maps"></div>
  <div class="custom">
    <canvas id="heroPrev" width="192" height="192"></canvas>
    <div class="opts"><b id="survName"></b><button class="btn alt" id="custBtn" data-i="customize"></button></div>
  </div>
  <button class="btn" id="playBtn" data-i="play"></button>
  <p class="small" data-i="controls"></p>
  <p class="small" id="bestMenu"></p>
</div>

<div class="overlay" id="customize">
  <div class="cwrap">
    <div class="cleft"><canvas id="heroBig" width="320" height="320"></canvas><label class="nickl"><span data-i="nickLabel"></span><input id="nick" maxlength="16" autocomplete="off" spellcheck="false"></label><button class="btn alt small2" id="randBtn" data-i="random"></button></div>
    <div class="cright"><div class="ctabs" id="ctabs"></div><div id="cgrid"></div></div>
  </div>
  <button class="btn" id="okBtn" data-i="ok"></button>
</div>

<div class="overlay" id="levelup">
  <h2 id="luTitle">Niveau supérieur !</h2>
  <p class="small" data-i="pickOne"></p>
  <div class="cards" id="cards"></div>
</div>

<div class="overlay" id="pause">
  <h2 data-i="pause"></h2>
  <div class="snd">
    <label><span data-i="volm"></span> <input type="range" id="volM" min="0" max="100"></label>
    <label><span data-i="vol"></span> <input type="range" id="volS" min="0" max="100"></label>
    <label class="chk"><input type="checkbox" id="muteChk"> <span data-i="mute"></span></label>
  </div>
  <div class="row"><button class="btn" id="resumeBtn" data-i="resume"></button><button class="btn alt" id="quitBtn" data-i="menu"></button></div>
</div>

<div class="overlay" id="over">
  <h2 id="overTitle">Tu as été submergé…</h2>
  <div class="stats" id="overStats"></div>
  <div class="row"><button class="btn" id="againBtn" data-i="again"></button><button class="btn alt" id="menuBtn" data-i="menu"></button></div>
</div>

/* =========================================================
   OUTILS DE DESSIN — chaque sprite est dessiné une seule fois
   puis recopié (drawImage) : c'est ce qui garde le jeu fluide.
   ========================================================= */
const SS=2;
function mk(size,fn){const c=document.createElement('canvas');c.width=c.height=Math.ceil(size*SS);const g=c.getContext('2d');g.scale(SS,SS);g.translate(size/2,size/2);g.lineJoin='round';g.lineCap='round';fn(g);return c;}
function flashOf(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='rgba(255,255,255,.92)';g.fillRect(0,0,c.width,c.height);return c;}
function eye(g,x,y,r,glow,core){g.fillStyle=glow;g.beginPath();g.arc(x,y,r*2,0,TAU);g.fill();g.fillStyle=core;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function poly(g,n,r,rot){g.beginPath();for(let k=0;k<n;k++){const a=rot+k/n*TAU;k?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();}
function glow(g,c,b){g.shadowColor=c;g.shadowBlur=b;}
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function tile(fn){const c=document.createElement('canvas');c.width=c.height=256;fn(c.getContext('2d'),seeded(11));return c;}

function zfig(g,f,skin,shirt,pants,eyeC,s){
  g.save();g.scale(s,s);const a=f?1.4:-1.4;
  g.fillStyle=skin;g.fillRect(-14,-3+a,7,4);g.fillRect(7,-3-a,7,4);
  g.fillStyle=pants;g.fillRect(-7,8,6,6+(f?1:0));g.fillRect(1,8,6,6+(f?0:1));
  g.fillStyle=shirt;rrect(g,-8,-2,16,12,4);g.fill();
  g.fillStyle=skin;g.beginPath();g.moveTo(-4,10);g.lineTo(-1,5);g.lineTo(1,10);g.fill();
  g.beginPath();g.arc(0,-7,7,0,TAU);g.fill();
  g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.arc(2.5,-4.5,2.6,0,TAU);g.fill();
  eye(g,-2.6,-8,1.5,eyeC+'.35)',eyeC+'1)');eye(g,2.6,-8,1.5,eyeC+'.35)',eyeC+'1)');
  g.strokeStyle='rgba(20,28,12,.9)';g.lineWidth=1.2;g.beginPath();g.moveTo(-2.6,-3.6);g.lineTo(-.6,-4.3);g.lineTo(1,-3.4);g.lineTo(2.8,-4.1);g.stroke();
  g.restore();
}
function enraged(base,k){return(g,f)=>{g.save();g.scale(k,k);glow(g,'rgba(255,30,30,.95)',5);base(g,f);g.restore();};}
function flame(g,x,y,s){g.fillStyle='rgba(255,120,20,.85)';g.beginPath();g.moveTo(x,y-s*1.6);g.quadraticCurveTo(x+s,y-s*.4,x,y);g.quadraticCurveTo(x-s,y-s*.4,x,y-s*1.6);g.fill();g.fillStyle='#ffd35a';g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x+s*.5,y-s*.3,x,y);g.quadraticCurveTo(x-s*.5,y-s*.3,x,y-s);g.fill();}
/* ---- Zombies variés : hommes, femmes, flics, ouvriers, soldats… ---- */
function zv(g,f,V,s,eyeC){
  g.save();g.scale(s,s);const a=f?1.4:-1.4,sk=V.skin||'#8fbf6a',sh=V.shirt||'#5a4a3a';
  if(V.hair==='long'){g.fillStyle=V.hc;rrect(g,-8.4,-14,16.8,16,6);g.fill();}
  g.fillStyle=V.sleeve?sh:sk;g.fillRect(-14,-3+a,7,4);g.fillRect(7,-3-a,7,4);g.fillStyle=sk;g.fillRect(-14,-3+a,2.4,4);g.fillRect(11.6,-3-a,2.4,4);
  if(V.dress){g.fillStyle=sk;g.fillRect(-6,11,4,4+(f?1:0));g.fillRect(2,11,4,4+(f?0:1));g.fillStyle=V.pants||sh;g.beginPath();g.moveTo(-8,4);g.lineTo(8,4);g.lineTo(10,13);g.lineTo(-10,13);g.closePath();g.fill();}
  else{g.fillStyle=V.pants||'#3e3328';g.fillRect(-7,8,6,6+(f?1:0));g.fillRect(1,8,6,6+(f?0:1));}
  g.fillStyle=sh;rrect(g,-8,-2,16,V.dress?8:12,4);g.fill();
  const x=V.extra||'';
  if(x.includes('camo')){g.fillStyle='rgba(30,40,20,.45)';for(const[px,py,r]of[[-4,1,2.5],[3,5,2],[5,-1,1.6],[-3,7,1.8]]){g.beginPath();g.arc(px,py,r,0,TAU);g.fill();}}
  if(x.includes('plaid')){g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1;g.beginPath();for(let k=-6;k<8;k+=4){g.moveTo(k,-2);g.lineTo(k,10);g.moveTo(-8,k+2);g.lineTo(8,k+2);}g.stroke();}
  if(x.includes('hawaii')){g.fillStyle='rgba(255,255,255,.7)';for(const[px,py]of[[-4,1],[3,4],[-2,7],[5,0]]){g.beginPath();g.arc(px,py,1.4,0,TAU);g.fill();}}
  if(x.includes('stripes')){g.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<10;k+=3)g.fillRect(-8,k,16,1.3);}

  if(x.includes('tie')){g.fillStyle=V.tie||'#b3262d';g.beginPath();g.moveTo(-1,-2);g.lineTo(1,-2);g.lineTo(1.8,6);g.lineTo(0,8);g.lineTo(-1.8,6);g.closePath();g.fill();}
  if(x.includes('badge')){g.fillStyle='#f5c542';g.fillRect(2.5,0,3,3);}
  if(x.includes('medals')){g.fillStyle='#f5c542';g.fillRect(-6,0,2,3);g.fillRect(-3.5,0,2,3);g.fillStyle='#c84040';g.fillRect(-1,0,2,3);}
  if(x.includes('belt')){g.fillStyle='#1b1b1b';g.fillRect(-8,7,16,2);}
  g.fillStyle=sk;g.beginPath();g.moveTo(-4,10);g.lineTo(-1,5);g.lineTo(1,10);g.fill();
  g.beginPath();g.arc(0,-7,7,0,TAU);g.fill();
  g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.arc(2.5,-4.5,2.6,0,TAU);g.fill();
  const hc=V.hc||'#3b2a1e';g.fillStyle=hc;
  if(V.hair==='short'){g.beginPath();g.arc(0,-8.5,7.2,Math.PI,0);g.fill();}

/* =========================================================
   CARTES — générées à l'infini par « pâtés » de 720 px.
   Chaque pâté est dessiné une seule fois puis gardé en mémoire.
   Les obstacles (rects / cercles) sont solides.
   ========================================================= */
const BLK=720,ROAD=180,INNER=BLK-ROAD,OFF=ROAD/2;
function hsh(a,b,k){const v=Math.sin(a*127.1+b*311.7+k*74.7)*43758.5453;return v-Math.floor(v);}
const CAR_COLS=['#5c6b7a','#7a6a52','#3f5a4a','#8a8f96','#4a4f70','#6e5a6e','#b5a888','#2f3540'];
function carSprite(col,kind){ // vu de dessus, orienté vers la droite
  const L=kind==='bus'?150:kind==='van'?72:62,Wd=kind==='bus'?40:30;
  const c=document.createElement('canvas');c.width=L*2+8;c.height=Wd*2+8;const g=c.getContext('2d');g.scale(2,2);g.translate(4/2+L/2,4/2+Wd/2);
  g.fillStyle='rgba(0,0,0,.35)';rrect(g,-L/2+3,-Wd/2+4,L,Wd,7);g.fill();
  g.fillStyle=col;rrect(g,-L/2,-Wd/2,L,Wd,kind==='bus'?6:9);g.fill();
  g.fillStyle='rgba(255,255,255,.08)';rrect(g,-L/2+3,-Wd/2+2,L-6,Wd/2-2,6);g.fill();
  if(kind==='bus'){g.fillStyle='#1e2630';for(let x=-L/2+12;x<L/2-14;x+=18)g.fillRect(x,-Wd/2+3,13,Wd-6);g.fillStyle='#2a3440';g.fillRect(L/2-12,-Wd/2+4,8,Wd-8);}
  else{g.fillStyle='#1e2630';rrect(g,L*.08,-Wd/2+4,L*.2,Wd-8,3);g.fill();rrect(g,-L*.36,-Wd/2+5,L*.14,Wd-10,3);g.fill();
    g.fillStyle='rgba(0,0,0,.18)';rrect(g,-L*.2,-Wd/2+4,L*.27,Wd-8,3);g.fill();
    g.strokeStyle='rgba(200,220,240,.35)';g.lineWidth=1;g.beginPath();g.moveTo(L*.12,-Wd/2+6);g.lineTo(L*.22,0);g.lineTo(L*.14,Wd/2-7);g.stroke();}
  g.fillStyle='#e8e2c0';g.fillRect(L/2-3,-Wd/2+3,3,5);g.fillRect(L/2-3,Wd/2-8,3,5);
  g.fillStyle='#5a2020';g.fillRect(-L/2,-Wd/2+3,2.5,5);g.fillRect(-L/2,Wd/2-8,2.5,5);
  if(kind==='police'){g.fillStyle='#e8e8e8';g.fillRect(-L*.05,-Wd/2,L*.16,Wd);g.fillStyle='#3e6fd8';g.fillRect(-L*.04,-6,4,5);g.fillStyle='#c84040';g.fillRect(-L*.04,1,4,5);}
  if(kind==='taxi'){g.fillStyle='#2a2a2a';g.fillRect(-4,-4,8,8);}
  return c;
}
const CARS=CAR_COLS.map(c=>carSprite(c,'car')).concat([carSprite('#1d1f24','police'),carSprite('#d9b23a','taxi'),carSprite('#6b7a8a','van'),carSprite('#c9a640','bus')]);
const ROOF_COLS=['#5d6168','#6a625a','#525c64','#6b665c','#5a5e57','#605a66'];
function drawBuilding(g,x,y,w,h,R){
  g.fillStyle='rgba(0,0,0,.38)';g.fillRect(x+12,y+14,w,h);
  const col=ROOF_COLS[(R()*ROOF_COLS.length)|0];
  g.fillStyle='#3a3d42';g.fillRect(x,y,w,h);
  g.fillStyle=col;g.fillRect(x+7,y+7,w-14,h-14);
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=2;g.strokeRect(x+10,y+10,w-20,h-20);
  // détails du toit
  const n=3+((R()*5)|0);
  for(let i=0;i<n;i++){const t=R(),px=x+20+R()*(w-80),py=y+20+R()*(h-80);
    if(t<.35){g.fillStyle='#8b9096';g.fillRect(px,py,34,26);g.fillStyle='#5f646a';g.beginPath();g.arc(px+17,py+13,9,0,TAU);g.fill();g.strokeStyle='#454a50';g.lineWidth=1.5;g.beginPath();g.moveTo(px+9,py+13);g.lineTo(px+25,py+13);g.moveTo(px+17,py+5);g.lineTo(px+17,py+21);g.stroke();}
    else if(t<.55){g.fillStyle='#2d3a48';g.fillRect(px,py,44,30);g.fillStyle='rgba(150,190,230,.15)';g.fillRect(px+3,py+3,18,24);g.fillRect(px+23,py+3,18,24);}
    else if(t<.7){g.fillStyle='#4a4e54';g.fillRect(px,py,40,40);g.fillStyle='#3a3e44';g.fillRect(px+6,py+6,28,28);}
    else if(t<.82){g.fillStyle='#6b5a46';g.beginPath();g.arc(px+20,py+20,20,0,TAU);g.fill();g.strokeStyle='#4f4232';g.lineWidth=3;g.beginPath();g.arc(px+20,py+20,14,0,TAU);g.stroke();}
    else{g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(px+20,py+14,26,12,R()*3,0,TAU);g.fill();}}
  g.strokeStyle='#4b5056';g.lineWidth=3;g.beginPath();const py=y+h*(.3+R()*.4);g.moveTo(x+8,py);g.lineTo(x+w-8,py);g.stroke();
  g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.2;for(let i=0;i<3;i++){let px=x+20+R()*(w-40),qy=y+20+R()*(h-40);g.beginPath();g.moveTo(px,qy);for(let k=0;k<4;k++){px+=R()*24-12;qy+=R()*24-12;g.lineTo(px,qy);}g.stroke();}
}
function tree(g,x,y,r){g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.arc(x+5,y+6,r,0,TAU);g.fill();g.fillStyle='#2f4a2a';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle='#3b5c33';g.beginPath();g.arc(x-r*.25,y-r*.25,r*.65,0,TAU);g.fill();g.fillStyle='#476b3c';g.beginPath();g.arc(x-r*.35,y-r*.4,r*.3,0,TAU);g.fill();}
function putCar(g,x,y,ang,R){const im=CARS[(R()*(CARS.length-1))|0];g.save();g.translate(x,y);g.rotate(ang);g.drawImage(im,-im.width/4,-im.height/4,im.width/2,im.height/2);g.restore();}

function sidewalk(g,base,line,edge){g.fillStyle=base;g.fillRect(0,0,INNER,INNER);g.strokeStyle=line;g.lineWidth=1;g.beginPath();for(let k=0;k<=INNER;k+=36){g.moveTo(k,0);g.lineTo(k,22);g.moveTo(k,INNER-22);g.lineTo(k,INNER);g.moveTo(0,k);g.lineTo(22,k);g.moveTo(INNER-22,k);g.lineTo(INNER,k);}g.stroke();
  g.fillStyle=edge;g.fillRect(0,0,INNER,3);g.fillRect(0,INNER-3,INNER,3);g.fillRect(0,0,3,INNER);g.fillRect(INNER-3,0,3,INNER);}
function bigTree(g,x,y,r,cols){g.fillStyle='rgba(0,0,0,.32)';g.beginPath();g.arc(x+7,y+9,r,0,TAU);g.fill();
  g.fillStyle=cols[0];g.beginPath();for(let k=0;k<9;k++){const a=k/9*TAU;g.moveTo(x+Math.cos(a)*r*.62+r*.45,y+Math.sin(a)*r*.62);g.arc(x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.45,0,TAU);}g.arc(x,y,r*.7,0,TAU);g.fill();
  g.fillStyle=cols[1];g.beginPath();g.arc(x-r*.2,y-r*.22,r*.55,0,TAU);g.fill();g.fillStyle=cols[2];g.beginPath();g.arc(x-r*.32,y-r*.36,r*.25,0,TAU);g.fill();}
function rock(g,x,y,r){g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x+4,y+5,r,r*.85,0,0,TAU);g.fill();g.fillStyle='#6b6f72';g.beginPath();g.ellipse(x,y,r,r*.85,.3,0,TAU);g.fill();g.fillStyle='#82878a';g.beginPath();g.ellipse(x-r*.25,y-r*.25,r*.5,r*.35,.3,0,TAU);g.fill();}
function waterCircle(g,x,y,r,deep,light,edge){g.fillStyle=edge;g.beginPath();g.arc(x,y,r+8,0,TAU);g.fill();g.fillStyle=deep;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle=light;g.beginPath();g.arc(x-r*.15,y-r*.15,r*.75,0,TAU);g.fill();}
function palm(g,x,y){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x+14,y+12,30,12,.4,0,TAU);g.fill();g.fillStyle='#7a5a36';g.beginPath();g.arc(x,y,9,0,TAU);g.fill();
  g.fillStyle='#3f7a3a';for(let k=0;k<7;k++){const a=k/7*TAU+.3;g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(0,-3);g.quadraticCurveTo(22,-10,40,0);g.quadraticCurveTo(22,6,0,3);g.closePath();g.fill();g.restore();}
  g.fillStyle='#5a9a4a';g.beginPath();g.arc(x,y,6,0,TAU);g.fill();}
function umbrella(g,x,y,c1,c2){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.arc(x+6,y+6,24,0,TAU);g.fill();for(let k=0;k<8;k++){g.fillStyle=k%2?c1:c2;g.beginPath();g.moveTo(x,y);g.arc(x,y,24,k/8*TAU,(k+1)/8*TAU);g.fill();}g.fillStyle='#eee';g.beginPath();g.arc(x,y,3,0,TAU);g.fill();}
function deckChair(g,x,y,col,a){g.save();g.translate(x,y);g.rotate(a||0);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(-7,-17,18,40);g.fillStyle='#e8e8e8';g.fillRect(-9,-20,18,40);g.fillStyle=col;g.fillRect(-7,-6,14,24);g.fillRect(-7,-18,14,10);g.restore();}
function flatRoof(g,x,y,w,h,col,edge){g.fillStyle='rgba(0,0,0,.38)';g.fillRect(x+12,y+14,w,h);g.fillStyle=edge;g.fillRect(x,y,w,h);g.fillStyle=col;g.fillRect(x+7,y+7,w-14,h-14);}

function buildGrid(){
  head.fill(-1);gx0=Math.floor(P.x/CELL)-GN/2;gy0=Math.floor(P.y/CELL)-GN/2;
  for(let i=0;i<enemies.length;i++){const e=enemies[i];let cx=Math.floor(e.x/CELL)-gx0,cy=Math.floor(e.y/CELL)-gy0;
    if(cx<0)cx=0;else if(cx>=GN)cx=GN-1;if(cy<0)cy=0;else if(cy>=GN)cy=GN-1;const c=cy*GN+cx;nxt[i]=head[c];head[c]=i;e.cell=c;}
  gridN=enemies.length;
}
let gridN=0;
function query(x,y,r){
  Q.length=0;let x0=Math.floor((x-r)/CELL)-gx0,x1=Math.floor((x+r)/CELL)-gx0,y0=Math.floor((y-r)/CELL)-gy0,y1=Math.floor((y+r)/CELL)-gy0;
  if(x0<0)x0=0;if(y0<0)y0=0;if(x1>=GN)x1=GN-1;if(y1>=GN)y1=GN-1;
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)for(let i=head[cy*GN+cx];i!==-1;i=nxt[i])Q.push(i);
  return Q;
}

function lateF(){const L=P.level;return 1+Math.max(0,L-80)*.06+Math.pow(Math.max(0,L-100),1.25)*.04;}
function mult(){const lf=lateF();return{hp:(1+time/120)*(1+(P.level-1)*.03)*lf,spd:(1+Math.min(time/1200,.35))*(1+Math.min(.25,(lf-1)*.03)),dmg:(1+time/300)*(1+(lf-1)*.25)};}
function spawnEnemy(t,x,y){
  if(enemies.length>=maxE+150)return null;
  const T=TYPES[t],m=mult(),e=ePool.pop()||{};
  const SP=TH.spr[t];e.t=t;e.T=T;e.S=SP.vars?SP.vars[(Math.random()*SP.vars.length)|0]:SP;e.x=x;e.y=y;e.sc=1;e.r=T.r;e.hid=0;e.sp=0;e.ft=0;e.grand=0;
  e.hp=e.maxHp=T.boss?T.hp*(1+time/150)*(1+(bossN-1)*.15)*(1+P.level*.02)*(1+Math.max(0,P.level-100)*.04):T.hp*m.hp;
  e.spd=T.spd*m.spd*(T.boss?1:rnd(.9,1.1));e.dmg=T.dmg*m.dmg;e.xp=T.xp;e.kx=0;e.ky=0;e.flash=0;e.oT=0;e.dead=false;e.uid=++uid;e.cell=0;
  e.st=T.boss?2.5:rnd(1,2.5);e.slT=0;e.slx=0;e.sly=0;e.nx=0;e.ny=0;e.ph=0;e.ax=0;e.ay=0;e.ang=0;e.guard=null;
  enemies.push(e);return e;
}
function ringPos(R,a){return[P.x+Math.cos(a)*R,P.y+Math.sin(a)*R];}
function pickType(){const r=Math.random(),A=MAP.animals||{};let acc=0;
  if(P.level>=100&&r<(acc+=Math.min(.12+(P.level-100)*.003,.3))){const q=Math.random();return q<.4?'z1':q<.75?'z3':'z2';}
  if(time>90&&r<(acc+=Math.min(.04+time/3000,.12)))return'e3';
  if(P.level>=50&&r<(acc+=.04))return'e4';
  if(time>45&&r<(acc+=(A.chien!==undefined?A.chien:.07)))return'chien';
  if(time>60&&r<(acc+=(A.corbeau!==undefined?A.corbeau:.05)))return'corbeau';
  if(time>20&&r<(acc+=(A.rat!==undefined?A.rat:.03)))return'rongeur';
  if(time>90&&r<(acc+=(A.sanglier||0)))return'sanglier';
  if(time>40&&r<(acc+=.28))return'e2';
  return'e1';}

function updateEnemies(dt){
  const R=Math.hypot(W,H)/2+60,far=R+520,far2=far*far,kd=Math.min(1,dt*8);
  bossAlive=0;bossRef=null;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];if(e.dead)continue;const T=e.T;
    if(e.guard){const g=e.guard;if(e.hp<e.maxHp||(P.x-g.x)*(P.x-g.x)+(P.y-g.y)*(P.y-g.y)<520*520)e.guard=null;else{if(e.flash>0)e.flash-=dt;continue;}}
    if(T.boss){bossAlive++;if(!bossRef||e.uid<bossRef.uid)bossRef=e;}
    const dx=P.x-e.x,dy=P.y-e.y,d2=dx*dx+dy*dy;
    if(d2>far2){const a=Math.atan2(P.dirY,P.dirX)+rnd(-1,1);e.x=P.x+Math.cos(a)*R;e.y=P.y+Math.sin(a)*R;continue;}
    const d=Math.sqrt(d2)||1,nx=dx/d,ny=dy/d;
    let vx=nx*e.spd,vy=ny*e.spd;
    // comportements spéciaux
    if(e.t==='e4'||e.t==='m3'||e.t==='z3'){
      if(d<230){vx=-nx*e.spd*.7;vy=-ny*e.spd*.7;}else if(d<300){vx=-ny*e.spd*.6;vy=nx*e.spd*.6;}
      e.st-=dt;if(e.st<=0&&d<520){const a0=Math.atan2(dy,dx);if(e.t==='m3'||e.t==='z3'){e.st=2;for(let k=-1;k<=1;k++)enemyShot(e.x,e.y,a0+k*.25,190,e.dmg,0);}else{e.st=2.6;enemyShot(e.x,e.y,a0,175,e.dmg,0);}sfx('spit');}
    }else if(T.beh){const low=e.hp<e.maxHp*.5;e.st-=dt;
      if(T.beh==='summon'){if(e.st<=0){e.st=low?3.2:4.5;const mn=T.mn||6;for(let k=0;k<mn;k++){const a=k/mn*TAU;spawnEnemy(T.minion||'e1',e.x+Math.cos(a)*(e.r+18),e.y+Math.sin(a)*(e.r+18));}sfx('summon');}}
      else if(T.beh==='charge'){
        if(e.ph===0){if(e.st<=0&&d<600){e.ph=1;e.st=.8;e.ax=nx;e.ay=ny;}}
        else if(e.ph===1){vx=0;vy=0;if(e.st<=0){e.ph=2;e.st=.55;sfx('dash');}}

      else if(T.beh==='ring'){
        if(d<250){vx=-nx*e.spd;vy=-ny*e.spd;}else if(d<330){vx=-ny*e.spd*.8;vy=nx*e.spd*.8;}
        if(e.st<=0){e.st=low?1.7:2.6;e.ang+=.22;for(let k=0;k<14;k++)enemyShot(e.x,e.y,e.ang+k/14*TAU,150,e.dmg*.8,1);sfx('spit');}}
      else if(T.beh==='whirl'){
        if(e.ph===0){if(e.st<=0&&d<450){e.ph=1;e.st=.75;}}
        else if(e.ph===1){vx=0;vy=0;if(e.st<=0){e.ph=2;e.st=2.6;sfx('slash');}}
        else{vx=nx*e.spd*1.9;vy=ny*e.spd*1.9;if(d<120*e.sc&&P.hurtT<=0)hurt(e.dmg);if(Math.random()<dt*8)sfx('slash');if(e.st<=0){e.ph=0;e.st=low?2.4:3.5;}}}
      else if(T.beh==='split'){if(e.st<=0){e.st=low?4:6;for(let k=0;k<3;k++){const a=Math.random()*TAU;spawnEnemy('e2',e.x+Math.cos(a)*(e.r+14),e.y+Math.sin(a)*(e.r+14));}}}
      else if(T.beh==='fire'){e.ft-=dt;if(e.ft<=0&&hazards.length<140){e.ft=.28;hazards.push({x:e.x,y:e.y,r:26*e.sc,t:4,dmg:e.dmg*.45});}
        if(e.ph===0){if(e.st<=0){e.ph=1;e.st=1.3;}}else{vx*=2.1;vy*=2.1;if(e.st<=0){e.ph=0;e.st=low?2:3;}}}
      else if(T.beh==='slam'){
        if(e.ph===0){if(e.st<=0&&d<420){e.ph=1;e.st=.85;}}
        else{vx=0;vy=0;if(e.st<=0){e.ph=0;e.st=low?3.2:4.5;shocks.push({x:e.x,y:e.y,r:e.r,max:240*e.sc,dmg:e.dmg,hit:false});shake=Math.max(shake,7);sfx('boom');}}}
      else if(T.beh==='burrow'){
        if(e.ph===0){if(e.st<=0){e.ph=1;e.st=2.4;e.hid=1;puff(e.x,e.y,'#6a5a4a',10);sfx('dash');}}
        else if(e.ph===1){vx=nx*e.spd*2.3;vy=ny*e.spd*2.3;if(e.st<=0||d<30){e.ph=2;e.st=.7;}}
        else{vx=0;vy=0;if(e.st<=0){e.ph=0;e.st=low?3:4.2;e.hid=0;const rr=95*e.sc+P.r;if(d<rr&&P.hurtT<=0)hurt(e.dmg*1.2);puff(e.x,e.y,'#8a6a48',18);shake=Math.max(shake,8);sfx('boom');}}}
    }
    // séparation (les ennemis ne se superposent pas)
    if(i<gridN&&e.ph!==2&&!e.hid){
      const c=e.cell,cx=c%GN,cy=(c/GN)|0;let sx=0,sy=0,cnt=0;
      for(let yy=cy-1;yy<=cy+1&&cnt<10;yy++){if(yy<0||yy>=GN)continue;

          for(let j=head[yy*GN+xx];j!==-1;j=nxt[j]){if(j===i)continue;const o=enemies[j];
            const ox=e.x-o.x,oy=e.y-o.y,rr=e.r+o.r,dd=ox*ox+oy*oy;
            if(dd<rr*rr&&dd>.01){const dl=Math.sqrt(dd),pu=(rr-dl)/rr;sx+=ox/dl*pu;sy+=oy/dl*pu;if(++cnt>=10)break;}}}}

function updateBullets(dt){

      for(let q=0;q<Q.length;q++){const e=enemies[Q[q]];if(e.dead||b.hits.indexOf(e.uid)!==-1)continue;

/* ---------- Boucle de jeu ---------- */
function update(dt){
  time+=dt;
  let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
  if(joy.on){const jx=joy.x-joy.ox,jy=joy.y-joy.oy,jd=Math.hypot(jx,jy);if(jd>8){const k=Math.min(jd,60)/60;mx=jx/jd*k;my=jy/jd*k;}}
  else{const m=Math.hypot(mx,my);if(m>0){mx/=m;my/=m;}}
  if(mx||my){P.x+=mx*P.spd*dt;P.y+=my*P.spd*dt;collide(P,P.r);const m=Math.hypot(mx,my);P.dirX=mx/m;P.dirY=my/m;if(Math.abs(mx)>.15)P.face=mx>0?1:-1;}
  if(P.regen)P.hp=Math.min(P.maxHp,P.hp+P.regen*dt);
  P.hurtT-=dt;P.flash-=dt;groanT-=dt;if(groanT<=0){groanT=rnd(2.5,5.5);if(enemies.length>8)sfx('groan');}shake=Math.max(0,shake-dt*30);gemPitch=Math.max(0,gemPitch-dt*6);

  const rate=Math.min(1.1+time*.026+P.level*.05,16+Math.min(10,Math.max(0,P.level-100)*.1));spawnAcc+=rate*dt;
  const R=Math.hypot(W,H)/2+40;
  while(spawnAcc>=1){spawnAcc-=1;if(enemies.length<maxE){const p=ringPos(R,Math.random()*TAU),t=pickType();if(t==='rongeur'){for(let k=0;k<5;k++)spawnEnemy('rongeur',p[0]+rnd(-30,30),p[1]+rnd(-30,30));}else spawnEnemy(t,p[0],p[1]);}}
  if(P.level>=10&&nextHorde<0){nextHorde=time+20;}
  if(nextHorde>0&&time>=nextHorde){hordeN++;nextHorde+=60;startHorde();}
  if(time>=nextBoss){nextBoss+=Math.max(75,150-P.level*1.2);spawnBigBoss();}
  if(time>=nextElite){nextElite+=rnd(55,75)*Math.max(.45,1-P.level/90);for(let k=0;k<1+Math.floor(P.level/30);k++)spawnElite();}

  if(time>=nextCap){if(caps.length<2){spawnCaptive();nextCap=time+rnd(70,100)*(P.level>=100?.8:1);}else nextCap=time+20;}
  updateCaptives(dt);
  buildGrid();
  updateEnemies(dt);
  if(state!=='play')return;
  weaponsUpdate(dt);
  updateBullets(dt);
  if(state!=='play')return;
  updatePickups(dt);
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t-=dt;t.y-=32*dt;if(t.t<=0){tPool.push(t);texts[i]=texts[texts.length-1];texts.pop();}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;if(p.t<=0){pPool.push(p);parts[i]=parts[parts.length-1];parts.pop();}}
  for(const arr of[zaps,slashes,booms,lasers,novas])for(let i=arr.length-1;i>=0;i--){arr[i].t-=dt;if(arr[i].t<=0)arr.splice(i,1);}
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead){ePool.push(enemies[i]);enemies[i]=enemies[enemies.length-1];enemies.pop();}

  $('time').textContent=fmt(time);
  $('horde').textContent=t(bossN%2===1?'gbossIn':'bossIn',fmt(nextBoss-time));$('horde2').textContent=nextHorde>0?t('hordeIn',fmt(nextHorde-time)):t('hordeLvl');
  $('kills').textContent='💀 '+kills;
  const bb=$('bossbar');
  if(bossRef&&!bossRef.dead){bb.style.display='block';$('bossname').textContent=t('b_'+bossRef.t)+(bossAlive>1?'  (+'+(bossAlive-1)+')':'');$('bossfill').style.width=Math.max(0,bossRef.hp/bossRef.maxHp*100)+'%';}
  else bb.style.display='none';
}
function updateInv(){let h='';for(const k in WEAP)if(wl[k])h+='<span>'+WEAP[k].icon+' '+(P.evo[k]?'★':wl[k])+'</span>';$('inv').innerHTML=h;}
function makeChoices(mode){
  const out=[];
  const evos=Object.keys(WEAP).filter(k=>wl[k]>=WEAP[k].max&&!P.evo[k]);
  if(evos.length&&(mode==='tr'||Math.random()<.35))out.push({kind:'evo',k:evos[(Math.random()*evos.length)|0]});
  const pool=[];
  for(const k in WEAP){const L=wl[k];if(L<WEAP[k].max&&!out.some(o=>o.k===k))pool.push({w:L===0?1.15:1.7,kind:'w',k});}
  for(const k in STATS){if((P.stats[k]||0)<(STATS[k].max||5))pool.push({w:1,kind:'s',k});}
  while(out.length<3&&pool.length){let tot=0;for(const o of pool)tot+=o.w;let r=Math.random()*tot,i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break;}out.push(pool.splice(i,1)[0]);}
  const inf=Object.keys(INF);while(out.length<3)out.push({kind:'inf',k:inf.splice((Math.random()*inf.length)|0,1)[0]});
  return out;
}
function openLevelUp(mode){
  state='levelup';luMode=mode;joy.on=false;choices=makeChoices(mode);
  $('luTitle').textContent=mode==='tr'?t('chest'):t('lvlTitle',P.level-pendingLv+1);
  sfx(mode==='tr'?'chest':'lvl');
  $('cards').innerHTML=choices.map((c,i)=>{
    let ic,tt,tag,ds,cls='';
    if(c.kind==='evo'){const d=WEAP[c.k];ic=d.icon+'★';tt=d.evo;tag=t('evo');cls=' evo';ds=t('evoD',d.name);}
    else if(c.kind==='w'){const L=wl[c.k],d=WEAP[c.k];ic=d.icon;tt=d.name;tag=L===0?t('newW'):t('lv',L+1)+(L+1===d.max?' (MAX)':'');cls=L===0?' new':'';ds=t(d.desc[L]);}
    else if(c.kind==='s'){const d=STATS[c.k],n=P.stats[c.k]||0;ic=d.icon;tt=t('s_'+c.k);tag=(n+1)+' / '+(d.max||5);ds=t('sd_'+c.k);}
    else{const d=INF[c.k];ic=d.icon;tt=t('n_'+c.k);tag=t('bonus');ds=t('nd_'+c.k);}
    return '<div class="card'+(c.kind==='evo'?' cevo':'')+'" data-i="'+i+'"><span class="k">'+(i+1)+'</span><div class="ic">'+ic+'</div><div class="tt">'+tt+'</div><span class="tag'+cls+'">'+tag+'</span><div class="ds">'+ds+'</div></div>';
  }).join('');
  $('levelup').classList.add('show');
}
$('cards').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)pick(+c.dataset.i);});
function pick(i){
  if(state!=='levelup')return;const c=choices[i];if(!c)return;
  if(c.kind==='w')wl[c.k]++;else if(c.kind==='evo'){P.evo[c.k]=1;banner('★ '+WEAP[c.k].evo+' !');}else if(c.kind==='s'){STATS[c.k].apply();P.stats[c.k]=(P.stats[c.k]||0)+1;}else INF[c.k].apply();
  if(luMode==='tr')pendingTr--;else pendingLv--;
  updateInv();updateHud();sfx('pick');
  $('levelup').classList.remove('show');
  if(pendingTr>0)openLevelUp('tr');else if(pendingLv>0)openLevelUp('lv');else{state='play';last=performance.now();}
}
function togglePause(){
  if(state==='play'){state='pause';joy.on=false;$('pause').classList.add('show');}
  else if(state==='pause'){state='play';$('pause').classList.remove('show');last=performance.now();}
}
function bestKey(){return'horde_best_'+MAP.id;}
function getBest(){try{return JSON.parse(localStorage.getItem(bestKey())||'null');}catch(_){return null;}}
function setBest(b){try{localStorage.setItem(bestKey(),JSON.stringify(b));}catch(_){}}
function showBestMenu(){const b=getBest();$('bestMenu').textContent=b?t('record')+' ('+t('m_'+MAP.id)+') : '+fmt(b.time)+' · '+t('levelW')+' '+b.level:'';}
function gameOver(){
  state='over';joy.on=false;updateHud();sfx('over');
  const b=getBest(),rec=!b||time>b.time;if(rec)setBest({time:time,level:P.level,kills:kills});
  const best=rec?{time:time}:b;
  $('overTitle').textContent=t('over');
  $('overStats').innerHTML=(custom.name?'<span>'+t('nickLabel')+'</span><b>'+custom.name.replace(/[&<>]/g,'')+'</b>':'')+'<span>'+t('stTime')+'</span><b>'+fmt(time)+'</b><span>'+t('stLvl')+'</span><b>'+P.level+'</b><span>'+t('stKills')+'</span><b>'+kills+'</b><span>'+t('stBoss')+'</span><b>'+bossN+'</b><span>'+t('record')+'</span><b>'+fmt(best.time)+(rec?' 🏆':'')+'</b>';
  $('over').classList.add('show');
}
function start(){
  audioInit();newGame();state='play';last=performance.now();$('hud').classList.remove('hide');
  for(const id of['menu','over','pause','levelup'])$(id).classList.remove('show');
}
function toMenu(){state='menu';newGame();$('hud').classList.add('hide');for(const id of['over','pause','levelup'])$(id).classList.remove('show');showBestMenu();$('menu').classList.add('show');}

/* ---------- Menu : univers + personnalisation ---------- */
function saveCustom(){try{localStorage.setItem('horde_custom2',JSON.stringify(custom));}catch(_){}}
function themePreview(T){const c=document.createElement('canvas');c.width=340;c.height=192;const g=c.getContext('2d');
  g.fillStyle=g.createPattern(T.groundImg,'repeat');g.fillRect(0,0,340,192);
  const put=(im,x,y,s)=>g.drawImage(im,x-s/2,y-s/2,s,s);
  put(T.spr.e3.img[0],70,70,TYPES.e3.size*2);put(T.spr.e1.img[0],270,60,TYPES.e1.size*2.2);put(T.spr.e2.img[0],250,140,TYPES.e2.size*2.2);put(T.spr.e4.img[0],90,150,TYPES.e4.size*2.2);
  const h=mk(46,g2=>T.hero(g2,COLORS[1]));put(h,170,100,92);return c.toDataURL();}
function setMap(i){MAP=MAPS[i]||MAPS[0];custom.map=MAPS.indexOf(MAP);if(!MAP.groundImg)MAP.groundImg=MAP.ground();buildSprites(MAP);
  document.querySelectorAll('#maps .theme').forEach((el,k)=>el.classList.toggle('sel',k===custom.map));newGame();showBestMenu();saveCustom();}
const MAPIMG=MAPS.map(M=>mapPreview(M));
function renderMaps(){$('maps').innerHTML=MAPS.map((M,i)=>'<div class="theme'+(MAP===M?' sel':'')+'" data-m="'+i+'"><img alt="" src="'+MAPIMG[i]+'"><div>'+t('m_'+M.id)+'</div></div>').join('');}
renderMaps();
$('maps').addEventListener('click',e=>{const t=e.target.closest('.theme');if(t){audioInit();setMap(+t.dataset.m);sfx('pick');}});
function setTheme(i){
  TH=THEMES[i];applyThemeNames();makeVign();
  document.documentElement.style.setProperty('--acc',TH.acc);document.documentElement.style.setProperty('--accG',TH.accG);
  document.querySelectorAll('.theme').forEach((el,k)=>el.classList.toggle('sel',k===i));
  drawPrev();
}
function heroURL(c){return mk(46,g=>drawHero(g,c)).toDataURL();}
function drawPrev(){buildHero();for(const[id,sz]of[['heroPrev',192],['heroBig',320]]){const c=$(id),g=c.getContext('2d');g.clearRect(0,0,sz,sz);
  if(id==='heroPrev'){g.fillStyle='rgba(255,255,255,.05)';g.beginPath();g.arc(sz/2,sz/2,sz/2-4,0,TAU);g.fill();}g.drawImage(heroImg,0,0,sz,sz);}}
const PRESETS=[
  ['Survivant',{sex:'h',skin:1,hair:1,style:'court',shirt:1,pants:0,acc:'none'}],
  ['Sportive',{sex:'f',skin:2,hair:3,style:'queue',shirt:7,pants:1,acc:'cap'}],
  ['Punk',{sex:'h',skin:0,hair:7,style:'crete',shirt:6,pants:1,acc:'glasses'}],
  ['Militaire',{sex:'h',skin:3,hair:0,style:'rase',shirt:2,pants:3,acc:'band'}],
  ['Agent secret',{sex:'h',skin:4,hair:0,style:'court',shirt:6,pants:1,acc:'glasses'}],
  ['Reine',{sex:'f',skin:1,hair:4,style:'long',shirt:4,pants:4,acc:'crown'}],
  ['Aventurière',{sex:'f',skin:5,hair:0,style:'long',shirt:3,pants:2,acc:'band'}],
  ['Rouquin',{sex:'h',skin:0,hair:5,style:'court',shirt:2,pants:0,acc:'cap'}]];
const CTABS=[['styles','tStyles'],['corps','tBody'],['cheveux','tHair'],['tenue','tOutfit'],['acc','tAcc']];
let ctab='styles';
function tilesHTML(k,opts){return '<div class="tiles">'+opts.map(([v,label])=>{const c=Object.assign({},custom,{[k]:v});if(k==='sex')c.style=v==='f'?'long':'court';
  return '<div class="tile'+(String(custom[k])===String(v)?' sel':'')+'" data-k="'+k+'" data-v="'+v+'"><img alt="" src="'+heroURL(c)+'">'+label+'</div>';}).join('')+'</div>';}
function swHTML(k,cols){return '<div class="sws">'+cols.map((c,i)=>'<button class="'+(custom[k]===i?'sel':'')+'" data-k="'+k+'" data-v="'+i+'" style="background:'+c+'"></button>').join('')+'</div>';}
function renderCustom(){
  $('ctabs').innerHTML=CTABS.map(([k,l])=>'<button class="'+(k===ctab?'sel':'')+'" data-t="'+k+'">'+t(l)+'</button>').join('');
  let h='';
  if(ctab==='styles')h='<div class="csec">'+t('cPreset')+'</div><div class="tiles">'+PRESETS.map(([n,c],i)=>'<div class="tile" data-p="'+i+'"><img alt="" src="'+heroURL(c)+'">'+t('p'+i)+'</div>').join('')+'</div>';
  else if(ctab==='corps')h='<div class="csec">'+t('cChar')+'</div>'+tilesHTML('sex',[['h',t('x_h')],['f',t('x_f')]])+'<div class="csec">'+t('cSkin')+'</div>'+swHTML('skin',SKINS);
  else if(ctab==='cheveux')h='<div class="csec">'+t('cStyle')+'</div>'+tilesHTML('style',STYLES.map(s=>[s[0],t('y_'+s[0])]))+'<div class="csec">'+t('cHairC')+'</div>'+swHTML('hair',HAIRS);
  else if(ctab==='tenue')h='<div class="csec">'+t('cTop')+'</div>'+swHTML('shirt',COLORS)+'<div class="csec">'+t('cPants')+'</div>'+swHTML('pants',PANTS);
  else h='<div class="csec">'+t('cAcc')+'</div>'+tilesHTML('acc',ACCS.map(a=>[a[0],t('a_'+a[0])]));
  $('cgrid').innerHTML=h;
}
$('ctabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;ctab=b.dataset.t;renderCustom();sfx('pick');});
$('cgrid').addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p){custom=Object.assign(custom,PRESETS[+p.dataset.p][1]);refreshCustom();sfx('pick');return;}
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,v=b.dataset.v;const prevSex=custom.sex;custom[k]=(k==='sex'||k==='style'||k==='acc')?v:+v;
  if(k==='sex'&&v!==prevSex)custom.style=v==='f'?'long':'court';refreshCustom();sfx('pick');});
function refreshCustom(){drawPrev();if($('customize').classList.contains('show'))renderCustom();if(state==='menu')newGame();saveCustom();}
$('custBtn').onclick=()=>{audioInit();$('menu').classList.remove('show');$('customize').classList.add('show');renderCustom();sfx('pick');};
$('okBtn').onclick=()=>{$('customize').classList.remove('show');$('menu').classList.add('show');sfx('pick');};
$('randBtn').onclick=()=>{const r=n=>(Math.random()*n)|0;custom.sex=r(2)?'f':'h';custom.skin=r(SKINS.length);custom.hair=r(HAIRS.length);custom.style=STYLES[r(STYLES.length)][0];custom.shirt=r(COLORS.length);custom.pants=r(PANTS.length);custom.acc=ACCS[r(ACCS.length)][0];refreshCustom();sfx('pick');};
$('menu').addEventListener('pointerdown',()=>audioInit());
$('playBtn').onclick=start;$('againBtn').onclick=start;$('menuBtn').onclick=toMenu;$('quitBtn').onclick=toMenu;
$('resumeBtn').onclick=togglePause;$('pauseBtn').onclick=togglePause;
$('volS').value=Math.round(vol.s*100);$('volM').value=Math.round(vol.m*100);
$('volM').oninput=e=>{vol.m=e.target.value/100;if(musG){musG.gain.cancelScheduledValues(AC.currentTime);}applyVol();};
$('volS').oninput=e=>{vol.s=e.target.value/100;applyVol();sfx('pick');};
$('muteChk').onchange=e=>{audioInit();setMute(e.target.checked);};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(state==='menu'&&e.code==='Enter')start();});
function cleanName(s){return String(s||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16);}
function showName(){$('survName').textContent=custom.name||t('survivor');}
$('nick').addEventListener('input',e=>{custom.name=cleanName(e.target.value);saveCustom();showName();});

/* ---------- Boucle + qualité automatique ---------- */
let last=performance.now(),fAvg=16,qT=0;
function frame(now){
  const raw=now-last,dt=Math.min(raw/1000,.05);last=now;
  if(state==='play'){
    update(dt);
    fAvg=fAvg*.95+Math.min(raw,60)*.05;qT+=dt;
    if(qT>2){qT=0;
      if(fAvg>21&&quality>0){quality--;maxE=MAXE_Q[quality];}
      else if(fAvg<15&&quality<2){quality++;maxE=MAXE_Q[quality];}}
  }else if(state==='menu'){time+=dt;orbitAng+=dt;}
  render();
  if(AC&&!muted)musicTick();
  requestAnimationFrame(frame);
}
setMute(muted);
function applyLang(){
  document.documentElement.lang=LANGS[LI][0];
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  $('nick').placeholder=t('nickPh');$('nick').value=custom.name||'';showName();
  $('langs').innerHTML=LANGS.map(([c,n],i)=>'<button class="'+(i===LI?'sel':'')+'" data-l="'+i+'" title="'+n+'">'+flagSVG(c)+'</button>').join('');
  applyThemeNames();renderMaps();showBestMenu();if($('customize').classList.contains('show'))renderCustom();if(P){updateInv();updateHud();}
}
$('langs').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;LI=+b.dataset.l;try{localStorage.setItem('horde_lang',LI);}catch(_){}applyLang();sfx('pick');});
setTheme(0);setMap(custom.map||0);refreshCustom();resize();applyLang();
requestAnimationFrame(frame);
</script>
