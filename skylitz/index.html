<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skylitz</title>
<style>
:root{--acc:#7dd3fc;--accG:rgba(125,211,252,.45);--pan:rgba(14,18,28,.88)}
html,body{margin:0;height:100%;background:#07090f;color:#eef2f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:safe center;flex-direction:column;gap:12px;padding:16px;text-align:center;box-sizing:border-box;overflow:auto;z-index:5}
.overlay.show{display:flex}
.dim{background:rgba(5,7,12,.62)}
h1{margin:0;font-size:clamp(40px,8vw,74px);font-weight:900;letter-spacing:5px;font-style:italic;color:#fff;text-shadow:0 0 26px var(--accG),4px 4px 0 #1d4ed8;line-height:1}
h1 span{color:var(--acc);text-shadow:0 0 22px var(--accG),4px 4px 0 #1d4ed8}
h2{margin:0;font-size:36px;font-weight:900;font-style:italic;color:var(--acc)}
h3{margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
p{margin:0;max-width:600px;line-height:1.45;color:#c9d2e0}
.small{font-size:13px;opacity:.65}
.btn{background:linear-gradient(180deg,#9be3ff,#38bdf8);color:#06233a;border:0;border-radius:12px;padding:13px 40px;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:1px;font-style:italic}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#232a3a;color:#eef2f8;font-style:normal}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.55}
.langs button.sel{border-color:var(--acc);opacity:1}
.langs svg{border-radius:2px;display:block}
.cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px}
.card{width:150px;border-radius:12px;border:3px solid transparent;cursor:pointer;overflow:hidden;background:#141924;text-align:left}
.card.sel{border-color:var(--acc)}
.card img{display:block;width:100%;height:80px;object-fit:cover}
.card div{padding:5px 8px;font-weight:800;font-size:13px}
.mode{width:170px;padding:8px 10px;box-sizing:border-box}
.mode b{display:block;font-size:15px}
.mode small{display:block;font-size:11px;opacity:.7;font-weight:600;line-height:1.3;margin-top:2px}
.diff{display:flex;gap:6px}
.diff button{background:#1b2130;color:#cfd6e4;border:2px solid #2a3245;border-radius:9px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:13px}
.diff button.sel{border-color:var(--acc);color:#fff;background:#2a2410}
.topbar{position:fixed;top:10px;right:12px;display:flex;gap:8px;z-index:6;align-items:center}
.chip{background:var(--pan);border-radius:20px;padding:7px 14px;font-weight:900;font-size:15px}
.chip.cr{color:var(--acc)}
.icon{background:var(--pan);color:#fff;border:0;border-radius:10px;width:40px;height:38px;font-size:17px;cursor:pointer}

#hud{position:fixed;inset:0;pointer-events:none;z-index:3;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.75)}
#hud.hide{display:none}
.hl{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:2px;background:rgba(5,8,14,.42);border-radius:12px;padding:8px 14px}
.hl .sc{font-size:30px;font-style:italic;color:#fff}
.hl .cn{font-size:20px;color:#ffd257}
#hMult{position:absolute;left:14px;top:96px;background:rgba(5,8,14,.42);border-radius:10px;padding:4px 10px;font-size:16px;color:var(--acc)}
#hPow{position:absolute;right:62px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pw{display:flex;align-items:center;gap:6px;background:rgba(5,8,14,.5);border-radius:10px;padding:4px 8px}
.pw i{display:block;width:70px;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}.pw b{display:block;height:100%}
#pauseBtn{position:absolute;top:12px;right:12px;pointer-events:auto;background:rgba(20,25,36,.85);border:0;border-radius:10px;width:40px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#msg{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:clamp(40px,10vw,100px);font-style:italic;color:#fff;text-shadow:0 0 30px var(--accG),4px 4px 0 #1d4ed8;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
#flash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0}
#toast{position:fixed;left:50%;top:15%;transform:translateX(-50%);background:rgba(10,12,20,.88);padding:9px 20px;border-radius:12px;font-weight:900;font-size:17px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:6px}
#toast.on{opacity:1}
.svi{vertical-align:-.22em;display:inline-block}
.res{display:grid;grid-template-columns:auto auto;gap:4px 24px;background:#141924;border-radius:14px;padding:12px 22px;font-weight:700;text-align:left;font-size:18px}
.res .v{text-align:right;color:#fff}
.snd{display:flex;flex-direction:column;gap:10px;background:#141924;border-radius:14px;padding:14px 20px}
.snd label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
.snd input[type=range]{width:170px;accent-color:var(--acc)}
.mss{display:flex;flex-direction:column;gap:5px;width:min(460px,92vw)}
.ms{display:grid;grid-template-columns:1fr 90px 64px;gap:8px;align-items:center;background:#141924;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;text-align:left}
.ms.ok{opacity:.55}.ms i{display:block;height:7px;border-radius:4px;background:#252c3c;overflow:hidden}.ms i b{display:block;height:100%;background:var(--acc)}.ms em{font-style:normal;text-align:right;color:#ffd257}
#multLine{font-size:13px;font-weight:700;color:var(--acc)}
#shopO{flex-direction:row;align-items:stretch;justify-content:flex-end;padding:0;gap:0}
#sView{flex:1;position:relative}
#sTop{position:absolute;left:14px;top:12px}
#sName{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:clamp(26px,5vw,44px);font-style:italic;font-weight:900;text-shadow:0 3px 10px #000}
#sPanel{width:380px;max-width:46vw;background:var(--pan);display:flex;flex-direction:column;gap:12px;padding:14px;box-sizing:border-box;overflow:auto;text-align:left}
.ctabs{display:flex;gap:6px}.ctabs button{background:#1b2130;color:#cfd6e4;border:0;border-radius:9px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:14px}.ctabs button.sel{background:var(--acc);color:#06233a}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ch{display:flex;align-items:center;gap:6px;background:#1b2130;border:2px solid #2a3245;border-radius:9px;color:#dfe5ef;font-weight:800;font-size:13px;padding:6px 8px;cursor:pointer;text-align:left}
.ch span{width:14px;height:14px;border-radius:50%;flex:0 0 auto}.ch.sel{border-color:var(--acc)}.ch.own{background:#1a2a24}
#sAct{width:100%}
.upr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-weight:800;font-size:14px;background:#1b2130;border-radius:10px;padding:8px}
.upr small{display:block;font-size:11px;opacity:.65;font-weight:600}
.pips{display:flex;gap:3px}.pips i{width:12px;height:8px;border-radius:2px;background:#2a3245}.pips i.on{background:#7CFF6B}
.upr button{background:var(--acc);border:0;border-radius:8px;padding:6px 10px;font-weight:900;cursor:pointer;font-size:12px;min-width:86px}.upr button:disabled{opacity:.4}
@media (max-height:820px){.overlay{gap:clamp(4px,1.2vh,12px);padding:clamp(6px,1.4vh,14px)}h1{font-size:clamp(28px,8vh,64px)}#menu>p.intro{display:none}h3{font-size:clamp(10px,2.2vh,13px)}.langs svg{width:clamp(20px,4.2vh,30px);height:auto}.card{width:clamp(84px,19vh,150px)}.card img{height:clamp(28px,9vh,80px)}.card div{padding:2px 6px;font-size:clamp(10px,2.3vh,13px)}.ms{padding:3px 8px;font-size:12px}.btn{padding:clamp(6px,1.7vh,13px) 28px;font-size:clamp(14px,3.2vh,19px)}}
@media (max-height:560px){.mss{display:none}#menu .small{display:none}}
@media (max-width:760px){#shopO{flex-direction:column}#sPanel{width:100%;max-width:none;max-height:52vh}#sName{bottom:6px}}
@media (max-width:560px){h1{font-size:40px}.cards{max-width:420px}.card{width:calc(33% - 6px);box-sizing:border-box}.card img{height:46px}.hl .sc{font-size:22px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud" class="hide">
  <div class="hl"><div class="sc" id="hScore">0</div><div class="cn" id="hCoins">0</div></div>
  <div id="hMult">x1</div>
  <div id="hPow"></div>
  <button id="pauseBtn"></button>
  <div id="msg"></div>
</div>
<div class="topbar" id="topbar"><div class="chip cr" id="coinChip">0</div><button class="icon" id="sndBtn"></button></div>
<div id="toast"></div>
<div class="overlay show dim" id="menu">
  <h1>SKY<span>LITZ</span></h1>
  <div class="langs" id="langs"></div>
  <p class="intro" data-i="intro"></p>
  <h3 data-i="mapL"></h3>
  <div class="cards" id="maps"></div>
  <div class="diff" id="diff"></div>
  <div class="row"><button class="btn alt" id="shopBtn" data-i="shop"></button><button class="btn" id="playBtn" data-i="play"></button></div>
  <h3 data-i="missions"></h3>
  <div class="mss" id="msList"></div>
  <p id="multLine"></p>
  <p class="small" id="ctlLine"></p>
  <p class="small" id="bestMenu"></p>
</div>
<div class="overlay" id="shopO">
  <div id="sView"><div id="sTop"><button class="btn alt" id="sBack" data-i="back" style="padding:8px 18px;font-size:15px"></button></div><div id="sName"></div></div>
  <div id="sPanel"><div class="ctabs" id="sTabs"></div><div id="sBody" style="display:flex;flex-direction:column;gap:10px"></div></div>
</div>
<div class="overlay dim" id="pause">
  <h2 data-i="pause"></h2>
  <div class="snd">
    <label><span data-i="vol"></span> <input type="range" id="volS" min="0" max="100"></label>
    <label><span data-i="music"></span> <input type="checkbox" id="musChk"></label>
    <label><span data-i="volm"></span> <input type="range" id="volM" min="0" max="100"></label>
    <label><span data-i="mute"></span> <input type="checkbox" id="muteChk"></label>
  </div>
  <div class="row"><button class="btn" id="resumeBtn" data-i="resume"></button><button class="btn alt" id="restartBtn" data-i="restart"></button><button class="btn alt" id="quitBtn" data-i="menu"></button></div>
</div>
<div class="overlay dim" id="over">
  <h2 id="overTitle"></h2>
  <div class="res" id="overRes"></div>
  <p id="overInfo"></p>
  <button class="btn" id="reviveBtn"></button>
  <div class="row"><button class="btn" id="againBtn" data-i="again"></button><button class="btn alt" id="overShop" data-i="shop"></button><button class="btn alt" id="menuBtn" data-i="menu"></button></div>
  <div class="mss" id="overMs"></div>
</div>
