<style>

.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.5}
.langs button.sel{border-color:var(--acc);opacity:1}
.langs svg{border-radius:2px;display:block}
.ib{width:46px;height:46px;border-radius:12px;border:0;background:rgba(30,22,44,.75);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

.cells button.skip{background:#7d5a2f}

#yn{display:flex;gap:18px}
#hold{position:relative;overflow:hidden;width:280px;padding:18px 10px;font-size:17px;touch-action:none}
