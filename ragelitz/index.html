<style>

.small{font-size:13px;opacity:.6}
.btn{background:linear-gradient(180deg,#ff8a5c,#e8382a);color:#fff;border:0;border-radius:12px;padding:13px 40px;font-size:20px;font-weight:900;cursor:pointer;letter-spacing:1px;font-style:italic;box-shadow:0 4px 0 #7a1020;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a1020}
.btn.alt{background:#2a2238;box-shadow:0 4px 0 #120d1c;font-style:normal;font-size:17px}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.85;font-style:normal;letter-spacing:0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.5}
.langs button.sel{border-color:var(--acc);opacity:1}
.langs svg{border-radius:2px;display:block}
.ib{width:46px;height:46px;border-radius:12px;border:0;background:rgba(30,22,44,.75);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

.ib:active{transform:scale(.94)}
#hudb{position:fixed;top:10px;right:10px;display:none;gap:8px;z-index:3}

.wrow{display:flex;flex-direction:column;gap:5px;align-items:center}

.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:100%}
.cells button{aspect-ratio:1;border-radius:8px;border:0;font-weight:900;font-size:15px;cursor:pointer;background:#2a2238;color:#fff;font-family:inherit;padding:0}
.cells button.done{background:#2f7d4a}
.cells button.skip{background:#7d5a2f}
.cells button.cur{outline:3px solid var(--acc)}
.cells button:disabled{opacity:.3;cursor:default}
.stat{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.stat svg{width:20px;height:20px}
#ctl{position:fixed;inset:auto 0 0 0;height:0;display:none;z-index:3}

#bL{left:calc(16px + env(safe-area-inset-left))}#bR{left:calc(118px + env(safe-area-inset-left))}#bJ{right:calc(20px + env(safe-area-inset-right));width:104px;height:104px}

#skip.show{display:block}
#skip.tiny{transform:scale(.42)}
#shame .box{background:#1b1426;border:3px solid #f2d27a;border-radius:18px;padding:22px;max-width:440px;display:flex;flex-direction:column;gap:16px;align-items:center}
#yn{display:flex;gap:18px}
#hold{position:relative;overflow:hidden;width:280px;padding:18px 10px;font-size:17px;touch-action:none}
#hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
#hold span{position:relative}

</head>
