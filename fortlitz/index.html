<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fortlitz</title>
<style>
:root{--acc:#7ee06d;--accD:#2f7d32}
html,body{margin:0;height:100%;background:#0e1410;color:#eef2f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:safe center;background:rgba(8,12,9,.74);flex-direction:column;gap:14px;padding:18px;text-align:center;box-sizing:border-box;overflow:auto;z-index:6}
.overlay.show{display:flex}
h1{margin:0;font-size:clamp(44px,9vw,80px);font-weight:900;letter-spacing:5px;color:#ffd86b;text-shadow:0 4px 0 #8a4b12,0 0 30px rgba(255,200,80,.45)}
h2{margin:0;font-size:36px;font-weight:900;color:#ffd86b;text-shadow:0 3px 0 #8a4b12}
h3{margin:0;font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
p{margin:0;max-width:560px;line-height:1.45;color:#cfd8cc}
.small{font-size:13px;opacity:.65}
.btn{background:#ffd86b;color:#2a1a05;border:0;border-radius:12px;padding:13px 40px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #a8701d}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a8701d}
.btn.alt{background:#24302a;color:#eef2f8;box-shadow:0 4px 0 #111a14}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.55}
.langs button.sel{border-color:#ffd86b;opacity:1}
.langs svg{border-radius:2px;display:block}
.maps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px}
.map{width:150px;border-radius:12px;border:3px solid transparent;cursor:pointer;overflow:hidden;background:#17201a;position:relative}
.map.sel{border-color:#ffd86b}
.map img{display:block;width:100%;height:84px;object-fit:cover}
.map div{padding:5px 8px;font-weight:800;font-size:13px;text-align:left}
.map .st{position:absolute;right:6px;top:4px;font-size:13px;text-shadow:0 1px 2px #000}
.diff{display:flex;gap:6px}
.diff button{background:#1b241e;color:#cfd8cc;border:2px solid #2c3a31;border-radius:9px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:13px}
.diff button.sel{border-color:#ffd86b;color:#fff;background:#2b2610}
.garage{display:flex;gap:16px;align-items:center;background:#17201a;border-radius:16px;padding:10px 18px}
.garage canvas{width:96px;height:96px}
.garage .opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#top{position:fixed;left:0;right:0;top:0;height:46px;display:none;align-items:center;gap:10px;padding:0 10px;background:linear-gradient(#0b110dcc,#0b110d00);z-index:3;font-weight:900;font-size:17px}
#top.on{display:flex}
#top .chip{background:rgba(10,16,12,.8);border:1px solid #2c3a31;border-radius:10px;padding:5px 10px;white-space:nowrap}
#top .sp{flex:1}
#top button{background:#24302a;color:#fff;border:1px solid #3a4b40;border-radius:10px;height:34px;min-width:40px;font-weight:900;font-size:14px;cursor:pointer;padding:0 10px}
#top button.go{background:#ffd86b;color:#2a1a05;border-color:#ffd86b}
#bar{position:fixed;left:0;right:0;bottom:0;height:84px;display:none;justify-content:center;align-items:center;gap:8px;background:linear-gradient(#0b110d00,#0b110dd9 35%);z-index:3}
#bar.on{display:flex}
#bar button{position:relative;width:70px;height:70px;border-radius:14px;border:2px solid #3a4b40;background:#17201acc;color:#fff;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#bar button canvas{position:absolute;left:7px;top:2px;width:56px;height:56px}
#bar button span{position:relative;font-weight:900;font-size:13px;background:rgba(0,0,0,.6);border-radius:6px;padding:0 5px;margin-bottom:3px;color:#ffd86b}
#bar button.sel{border-color:#ffd86b;box-shadow:0 0 12px rgba(255,216,107,.6)}
#bar button.no span{color:#ff7a7a}
#bar button .k{position:absolute;left:4px;top:2px;font-size:10px;opacity:.5;font-weight:800}
#pop{position:fixed;display:none;z-index:4;background:#17201af2;border:2px solid #3a4b40;border-radius:12px;padding:8px;gap:6px;flex-direction:column;align-items:stretch;min-width:150px;font-weight:800;font-size:13px}
#pop.on{display:flex}
#pop b{font-size:14px;text-align:center}
#pop .inf{opacity:.75;font-weight:600;text-align:center}
#pop button{border:0;border-radius:9px;padding:8px;font-weight:900;cursor:pointer;font-size:13px}
#pop .up{background:#ffd86b;color:#2a1a05}#pop .up.no{background:#4a4636;color:#b9b19a}
#pop .sell{background:#5a2626;color:#fff}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,7vw,70px);font-weight:900;color:#ffd86b;text-shadow:0 4px 0 #8a4b12,0 0 30px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
#msg.on{opacity:1}
#tip{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#5a2626;color:#fff;font-weight:800;border-radius:10px;padding:6px 14px;display:none;z-index:4}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ctabs button{background:#1b241e;color:#cfd8cc;border:0;border-radius:9px;padding:7px 14px;font-weight:800;cursor:pointer}
.ctabs button.sel{background:#ffd86b;color:#2a1a05}
.cgrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px;min-height:60px}
.cgrid button{background:#1b241e;border:2px solid #2c3a31;border-radius:10px;cursor:pointer;color:#fff;font-weight:800;padding:4px;min-width:44px;min-height:44px}
.cgrid button.sel{border-color:#ffd86b}
.cgrid .sw{width:40px;height:40px;padding:0;border-radius:50%}
.cgrid canvas{width:36px;height:36px;display:block}
#bigPrev{width:200px;height:200px}
input#nick{background:#17201a;border:2px solid #2c3a31;border-radius:10px;color:#fff;padding:9px 12px;font-size:16px;font-weight:700;text-align:center;width:240px}
.snd{display:flex;flex-direction:column;gap:10px;background:#17201a;border-radius:14px;padding:14px 20px}
.snd label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
.snd input[type=range]{width:170px;accent-color:#ffd86b}
.stars{font-size:46px;letter-spacing:6px}
@media (max-height:820px){
 .overlay{gap:clamp(5px,1.6vh,12px);padding:10px}
 h1{font-size:clamp(30px,9vh,56px)}
 #menu>p.intro{display:none}
 .maps{gap:5px}.map{width:clamp(96px,22vh,140px);border-width:2px}.map img{height:clamp(36px,11vh,70px)}.map div{padding:3px 6px;font-size:11px}
 .garage{padding:6px 12px}.garage canvas{width:clamp(48px,13vh,90px);height:clamp(48px,13vh,90px)}
 .btn{padding:clamp(7px,2vh,13px) 28px;font-size:clamp(15px,3.4vh,19px)}
 #bigPrev{width:clamp(110px,28vh,200px);height:clamp(110px,28vh,200px)}
}
@media (max-height:520px){#menu .small{display:none}}
@media (max-width:560px){
 h1{font-size:40px;letter-spacing:3px}
 #menu>p.intro{display:none}
 .maps{width:100%;max-width:420px}.map{width:calc(50% - 6px);box-sizing:border-box}.map img{height:56px}
 #top{font-size:14px;gap:5px;padding:0 6px}#top .chip{padding:4px 6px}
 #bar button{width:60px;height:64px}#bar button canvas{left:4px;width:50px;height:50px}
}
</style>
</head>

<canvas id="c"></canvas>
<div id="top"><span class="chip" id="hGold">0</span><span class="chip" id="hLives">20</span><span class="chip" id="hWave"></span><span class="sp"></span><button id="nextBtn" class="go"></button><button id="spdBtn">×1</button><button id="pauseBtn">❚❚</button></div>
<div id="bar"></div>
<div id="pop"><b id="popName"></b><div class="inf" id="popInf"></div><button class="up" id="popUp"></button><button class="sell" id="popSell"></button></div>
<div id="msg"></div><div id="tip"></div>

<div class="overlay show" id="menu">
  <h1>FORTLITZ</h1>
  <div class="langs" id="langs"></div>
  <p class="intro" data-i="intro"></p>
  <h3 data-i="chooseMap"></h3>
  <div class="maps" id="maps"></div>
  <div class="diff" id="diff"></div>
  <div class="garage"><canvas id="prev" width="192" height="192"></canvas><div class="opts"><b id="kName"></b><button class="btn alt" id="custBtn" data-i="customize"></button></div></div>
  <div class="row"><button class="btn" id="playBtn" data-i="play"></button><button class="btn alt" id="contBtn" style="display:none"></button></div>
  <p class="small" data-i="controls"></p>
</div>

<div class="overlay" id="customize">
  <h2 data-i="customize"></h2>
  <canvas id="bigPrev" width="400" height="400"></canvas>
  <input id="nick" maxlength="16" autocomplete="off">
  <div class="ctabs" id="ctabs"></div>
  <div class="cgrid" id="cgrid"></div>
  <div class="row"><button class="btn alt" id="randBtn" data-i="random"></button><button class="btn" id="okBtn" data-i="ok"></button></div>
</div>

<div class="overlay" id="pause">
  <h2 data-i="pause"></h2>
  <div class="snd">
    <label><span data-i="volm"></span> <input type="range" id="volM" min="0" max="100"></label>
    <label><span data-i="vol"></span> <input type="range" id="volS" min="0" max="100"></label>
    <label><span data-i="mute"></span> <input type="checkbox" id="muteChk"></label>
  </div>
  <div class="row"><button class="btn" id="resumeBtn" data-i="resume"></button><button class="btn alt" id="restartBtn" data-i="restart"></button><button class="btn alt" id="quitBtn" data-i="menu"></button></div>
</div>

<div class="overlay" id="over">
  <h2 id="overTitle"></h2>
  <div class="stars" id="overStars"></div>
  <p id="overInfo"></p>
  <div class="row"><button class="btn" id="againBtn" data-i="again"></button><button class="btn alt" id="menuBtn" data-i="menu"></button></div>
</div>

  M.path=new Set();for(let i=0;i<M.wp.length-1;i++){let[x,y]=M.wp[i];const[x2,y2]=M.wp[i+1];const dx=Math.sign(x2-x),dy=Math.sign(y2-y);
    while(true){if(x>=0&&y>=0&&x<GW&&y<GH)M.path.add(x+','+y);if(x===x2&&y===y2)break;x+=dx;y+=dy;}}
  const R=seeded(31+mi*97);M.block=new Set();M.decoList=[];
  for(let k=0;k<22;k++){const x=R()*GW|0,y=R()*GH|0,key=x+','+y;if(M.path.has(key)||M.block.has(key))continue;
    let near=false;for(const p of M.path){const[a,b]=p.split(',').map(Number);if(Math.abs(a-x)+Math.abs(b-y)<=1){near=true;break;}}
    if(near&&R()<.75)continue;M.block.add(key);M.decoList.push([x,y,R()]);}

  g.fillStyle='#0e1410';g.fillRect(0,0,W,H);
  const cols=L.T?GH:GW,rows=L.T?GW:GH;
  g.fillStyle=M.g1;g.fillRect(L.ox,L.oy,cols*cs,rows*cs);
  for(let x=0;x<GW;x++)for(let y=0;y<GH;y++){if((x+y)%2){const[a,b]=S(x,y);g.fillStyle=M.g2;g.fillRect(a,b,cs,cs);}}
  for(let i=0;i<120;i++){const x=R()*GW,y=R()*GH;const[a,b]=S(x,y);g.fillStyle='rgba(0,0,0,.06)';g.beginPath();g.arc(a,b,cs*(.05+R()*.12),0,TAU);g.fill();}
  if(M.deco==='beach'){g.fillStyle='rgba(60,170,220,.85)';for(let x=0;x<GW;x++){const[a,b]=S(x,GH-1);if(!M.path.has(x+','+(GH-1))&&!M.block.has(x+','+(GH-1)))g.fillRect(a,b+cs*.45,cs,cs*.55);}}
  // chemin
  g.lineCap='round';g.lineJoin='round';
  const line=(w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();M.pts.forEach(([x,y],i)=>{const[a,b]=S(x,y);i?g.lineTo(a,b):g.moveTo(a,b);});g.stroke();};
  line(cs*.98,M.path2);line(cs*.82,M.path);
  for(let i=0;i<220;i++){const d=R()*M.len,[x,y]=posAt(M,d),[a,b]=S(x+(R()-.5)*.6,y+(R()-.5)*.6);g.fillStyle='rgba(0,0,0,.08)';g.beginPath();g.arc(a,b,cs*.04,0,TAU);g.fill();}
  // décor
  for(const[x,y,r]of M.decoList){const[a,b]=S(x,y),c=cs/2;
    if(M.deco==='desert'){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(a+c+3,b+c+cs*.3,cs*.25,cs*.1,0,0,TAU);g.fill();g.fillStyle='#3f8f47';rr(g,a+c-cs*.1,b+cs*.15,cs*.2,cs*.65,cs*.1);g.fill();rr(g,a+c-cs*.32,b+cs*.35,cs*.2,cs*.12,cs*.06);g.fill();rr(g,a+c+cs*.12,b+cs*.28,cs*.2,cs*.12,cs*.06);g.fill();}
    else if(M.deco==='snow'||(M.deco==='meadow'&&r<.3)){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(a+c,b+cs*.85,cs*.32,cs*.1,0,0,TAU);g.fill();for(let k=0;k<3;k++){g.fillStyle=k%2?'#2d6a3e':'#245a33';g.beginPath();g.moveTo(a+c,b+cs*(.05+k*.2));g.lineTo(a+c+cs*(.2+k*.08),b+cs*(.45+k*.2));g.lineTo(a+c-cs*(.2+k*.08),b+cs*(.45+k*.2));g.closePath();g.fill();}
      if(M.deco==='snow'){g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(a+c,b+cs*.05);g.lineTo(a+c+cs*.1,b+cs*.25);g.lineTo(a+c-cs*.1,b+cs*.25);g.fill();}g.fillStyle='#5a3d22';g.fillRect(a+c-cs*.05,b+cs*.85,cs*.1,cs*.1);}
    else if(M.deco==='volcano'){g.fillStyle='#2b2220';g.beginPath();g.ellipse(a+c,b+c,cs*.4,cs*.32,r*3,0,TAU);g.fill();g.fillStyle='#ff6a1f';g.beginPath();g.ellipse(a+c,b+c,cs*.18,cs*.12,r*3,0,TAU);g.fill();g.fillStyle='#ffd23a';g.beginPath();g.arc(a+c,b+c,cs*.06,0,TAU);g.fill();}
    else if(M.deco==='swamp'){g.fillStyle='#3d6b5c';g.beginPath();g.ellipse(a+c,b+c,cs*.42,cs*.3,0,0,TAU);g.fill();g.fillStyle='#5fa04a';g.beginPath();g.arc(a+c-cs*.12,b+c,cs*.12,0,TAU);g.arc(a+c+cs*.15,b+c+cs*.05,cs*.09,0,TAU);g.fill();}
    else if(M.deco==='beach'){g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(a+c+3,b+c+4,cs*.3,cs*.15,0,0,TAU);g.fill();g.fillStyle='#2f9e44';for(let k=0;k<6;k++){g.save();g.translate(a+c,b+c);g.rotate(k/6*TAU+r);g.beginPath();g.ellipse(cs*.2,0,cs*.22,cs*.07,0,0,TAU);g.fill();g.restore();}g.fillStyle='#8a5a2b';g.beginPath();g.arc(a+c,b+c,cs*.07,0,TAU);g.fill();}
    else{g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(a+c+3,b+c+5,cs*.36,cs*.22,0,0,TAU);g.fill();g.fillStyle='#8f9499';g.beginPath();g.ellipse(a+c,b+c,cs*.36,cs*.27,r,0,TAU);g.fill();g.fillStyle='#a9aeb3';g.beginPath();g.ellipse(a+c-cs*.08,b+c-cs*.07,cs*.17,cs*.11,0,0,TAU);g.fill();}}
  // portail de départ
  {const[x,y]=M.wp[1];const sx=clamp(M.wp[0][0],0,GW-1),sy=clamp(M.wp[0][1],0,GH-1);const[a,b]=S(sx+.5,sy+.5);
    const gr=g.createRadialGradient(a,b,2,a,b,cs*.7);gr.addColorStop(0,'rgba(170,80,255,.8)');gr.addColorStop(1,'rgba(170,80,255,0)');g.fillStyle=gr;g.beginPath();g.arc(a,b,cs*.7,0,TAU);g.fill();}
}
/* ================= JEU ================= */
function runKey(){return'td_run_'+custom.map+'_'+custom.diff;}
function saveRun(){try{localStorage.setItem(runKey(),JSON.stringify({wave,gold,lives,towers:towers.map(t=>({type:t.type,lvl:t.lvl,gx:t.gx,gy:t.gy,spent:t.spent}))}));}catch(_){}}
function loadRun(){try{return JSON.parse(localStorage.getItem(runKey())||'null');}catch(_){return null;}}
function clearRun(){try{localStorage.removeItem(runKey());}catch(_){}}
function continueGame(){const r=loadRun();if(!r)return startGame();startGame();gold=r.gold;lives=r.lives;wave=r.wave;nextT=8;
  for(const s of r.towers){const tw={type:s.type,lvl:s.lvl,x:s.gx+.5,y:s.gy+.5,gx:s.gx,gy:s.gy,cd:0,ang:-Math.PI/2,spent:s.spent};towers.push(tw);grid[s.gx+','+s.gy]=tw;}
  updTop();renderBar();showMsg(t('waveN',wave+1),1.2);}
function updCont(){const r=loadRun(),b=$('contBtn');if(r&&r.wave>0){b.style.display='';b.textContent=t('cont',r.wave+1);}else b.style.display='none';}
function newGame(){
  towers=[];enemies=[];shots=[];fx=[];texts=[];grid={};spawnQ=[];sel=null;selTower=null;hidePop();
  gold=[300,240,200][custom.diff];lives=20;wave=0;nextT=15;speed=1;
}
function startGame(){audioInit();state='play';newGame();rebuild();for(const id of['menu','over','pause','customize'])$(id).classList.remove('show');$('top').classList.add('on');$('bar').classList.add('on');updTop();showMsg(t('waveN',1),1.2);}
function toMenu(){if(state==='pause'||state==='play'){if(wave>0)saveRun();}state='menu';newGame();rebuild();updCont();$('top').classList.remove('on');$('bar').classList.remove('on');for(const id of['over','pause'])$(id).classList.remove('show');$('menu').classList.add('show');renderMaps();}
function togglePause(){if(state==='play'){state='pause';$('pause').classList.add('show');hidePop();}else if(state==='pause'){state='play';$('pause').classList.remove('show');}}
let msgT=0;function showMsg(s,d){$('msg').textContent=s;$('msg').classList.add('on');msgT=d||1.2;}
let tipT=0;function tip(s){$('tip').textContent=s;$('tip').style.display='block';tipT=1.3;sfx('no');}
function hpMul(w){return(1+.15*(w-1)+.0075*(w-1)*(w-1))*[.7,1,1.3][custom.diff];}
function buildWave(w){const q=[],n=Math.round(Math.min(7+w*1.3,40+w*.35));const gap=Math.max(.38,.95-w*.02);
  const pool=['slime'];if(w>=3)pool.push('goblin','goblin');if(w>=5)pool.push('bat');if(w>=6)pool.push('orc');if(w>=9)pool.push('knight');if(w>=14)pool.push('orc','knight');if(w>=25)pool.push('giant');if(w>=35)pool.push('wraith','wraith');if(w>=45)pool.push('giant','knight');if(w>=55)pool.push('golem');if(w>=70)pool.push('golem','wraith','giant');
  const special=w%4===0&&w>=4?(w>=8?'bat':'goblin'):null;
  for(let i=0;i<n;i++){const ty=special&&i%2?special:pool[(Math.random()*pool.length)|0];q.push([ty,gap]);}
  if(w%10===0){const nb=w>=50?2:1;for(let i=0;i<nb;i++)q.push(['boss',2]);for(let i=0;i<Math.min(16,Math.floor(w/5));i++)q.push([w>=40?'giant':'orc',.6]);}
  return q;}
function callWave(early){if(wave>=WAVES||state!=='play')return;if(wave>0){gold+=12+wave*2;if(wave%10===0){const bonus=100+wave*6;gold+=bonus;showMsg(t('milestone',wave,bonus),1.8);sfx('upgrade');}saveRun();}wave++;if(early&&nextT>1){const b=Math.round(nextT*1.5);gold+=b;floatText('+'+b,null,'#ffd86b');}
  spawnQ=spawnQ.concat(buildWave(wave));spawnT=.3;nextT=wave<WAVES?24+Math.min(10,wave*.4):0;
  if(wave%10===0){showMsg(t('boss'),1.6);sfx('bossW');}else if(wave>1&&(wave-1)%10===0){}else if(wave===5){showMsg(t('flyers'),1.4);sfx('wave');}else{showMsg(t('waveN',wave),1);sfx('wave');}updTop();}
function spawn(type){const E=EN[type],m=hpMul(wave),hp=Math.round(E.hp*m);
  enemies.push({type,hp,max:hp,spd:E.spd*(type==='boss'?1:1+Math.min(.25,wave*.006)),d:0,slowT:0,slow:0,air:!!E.air,armor:E.armor||0,gold:Math.round(E.gold*(1+wave*.025)),lives:E.lives,fr:Math.random(),x:0,y:0,dead:false});}
function placeTower(gx,gy){const key=gx+','+gy,T=TOW[sel];
  if(gx<0||gy<0||gx>=GW||gy>=GH||MAP.path.has(key)||MAP.block.has(key)||grid[key])return false;
  if(gold<T.cost){tip(t('noGold'));return true;}
  gold-=T.cost;const tw={type:sel,lvl:1,x:gx+.5,y:gy+.5,gx,gy,cd:0,ang:-Math.PI/2,spent:T.cost};towers.push(tw);grid[key]=tw;sfx('build');puffAt(tw.x,tw.y,'#d8c7a8',8);updTop();renderBar();return true;}
function tstat(tw,k){const v=TOW[tw.type][k];return Array.isArray(v)?v[tw.lvl-1]:v;}
function upgradeTower(tw){if(tw.lvl>=MAXL)return;const c=TOW[tw.type].up[tw.lvl-1];if(gold<c){tip(t('noGold'));return;}gold-=c;tw.spent+=c;tw.lvl++;sfx('upgrade');puffAt(tw.x,tw.y,'#ffd86b',10);updTop();renderBar();showPop(tw);}
function sellTower(tw){const v=Math.round(tw.spent*.7);gold+=v;towers.splice(towers.indexOf(tw),1);delete grid[tw.gx+','+tw.gy];sfx('sell');floatText('+'+v,tw,'#ffd86b');hidePop();updTop();renderBar();}
function damage(e,dmg,kind){if(e.dead)return;let d=dmg;if(e.armor&&TOW[kind]&&TOW[kind].phys)d*=1-e.armor;e.hp-=d;
  if(e.hp<=0){e.dead=true;gold+=e.gold;floatText('+'+e.gold,e,'#ffd86b');puffAt(e.x,e.y,EN[e.type].col,e.type==='boss'?24:8);sfx('die');if(Math.random()<.3)sfx('coin');updTop();}}
function inRange(tw,e,r){const dx=e.x-tw.x,dy=e.y-tw.y;return dx*dx+dy*dy<=r*r;}
function pickTarget(tw){const r=tstat(tw,'range'),air=TOW[tw.type].air;let best=null;for(const e of enemies){if(e.dead||(e.air&&!air))continue;if(inRange(tw,e,r)&&(!best||e.d>best.d))best=e;}return best;}
function fire(tw,e){const T=TOW[tw.type],dmg=tstat(tw,'dmg');tw.ang=Math.atan2(e.y-tw.y,e.x-tw.x);
  if(tw.type==='archer'){shots.push({k:'arrow',x:tw.x,y:tw.y,tg:e,spd:11,dmg,src:'archer'});sfx('arrow');}
  else if(tw.type==='cannon'){shots.push({k:'ball',x:tw.x,y:tw.y,tx:e.x,ty:e.y,sx:tw.x,sy:tw.y,t:0,dur:Math.hypot(e.x-tw.x,e.y-tw.y)/6+.15,dmg,r:tstat(tw,'splash'),src:'cannon'});sfx('cannon');}
  else if(tw.type==='frost'){shots.push({k:'ice',x:tw.x,y:tw.y,tg:e,spd:8,dmg,slow:tstat(tw,'slow'),src:'frost'});sfx('frost');}
  else if(tw.type==='tesla'){let cur=e,hit=[e],pts=[[tw.x,tw.y],[e.x,e.y]];damage(e,dmg,'tesla');let d=dmg;
    for(let i=1;i<tstat(tw,'chain');i++){d*=.75;let nb=null,bd=2.2*2.2;for(const o of enemies){if(o.dead||hit.includes(o))continue;const dd=(o.x-cur.x)**2+(o.y-cur.y)**2;if(dd<bd){bd=dd;nb=o;}}if(!nb)break;hit.push(nb);pts.push([nb.x,nb.y]);damage(nb,d,'tesla');cur=nb;}
    fx.push({k:'zap',pts,t:0,life:.16});sfx('tesla');}
  else{shots.push({k:'bolt',x:tw.x,y:tw.y,tg:e,spd:16,dmg,src:'ballista'});sfx('ballista');}
}
function puffAt(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=.5+Math.random()*1.8;fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.4+Math.random()*.3,col,r:.06+Math.random()*.07});}}
function floatText(s,o,col){const x=o?o.x:GW/2,y=o?o.y:GH/2;texts.push({s,x,y,t:0,col});if(texts.length>40)texts.shift();}
function update(dt){
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').classList.remove('on');}
  if(tipT>0){tipT-=dt;if(tipT<=0)$('tip').style.display='none';}
  if(state==='menu'){menuSim(dt);return;}
  if(state!=='play')return;
  for(let st=0;st<speed;st++)step(dt);
}
function menuSim(dt){if(enemies.length<10&&Math.random()<dt*1.6){wave=Math.max(wave,3);const ty=['slime','goblin','orc','knight','bat','slime'][(Math.random()*6)|0];spawn(ty);}
  for(const e of enemies){e.d+=e.spd*dt*.9;e.fr+=dt*4;const p=posAt(MAP,e.d);e.x=p[0];e.y=p[1];if(e.d>=MAP.len)e.dead=true;}
  enemies=enemies.filter(e=>!e.dead);}
function step(dt){
  // vagues
  if(spawnQ.length){spawnT-=dt;if(spawnT<=0){const[ty,gap]=spawnQ.shift();spawn(ty);spawnT=gap;}}
  else if(wave<WAVES&&enemies.length===0&&wave>0&&nextT>8){nextT=Math.min(nextT,8);}
  if(wave<WAVES){nextT-=dt;if(nextT<=0)callWave(false);}
  // ennemis
  for(const e of enemies){if(e.dead)continue;const sl=e.slowT>0?1-e.slow:1;if(e.slowT>0)e.slowT-=dt;e.d+=e.spd*sl*dt;e.fr+=dt*(e.air?9:5);
    const p=posAt(MAP,e.d);e.x=p[0];e.y=p[1];
    if(e.d>=MAP.len){e.dead=true;lives=Math.max(0,lives-e.lives);sfx('leak');updTop();if(lives<=0){endGame(false);return;}}}
  // tours
  for(const tw of towers){tw.cd-=dt;if(tw.cd<=0){const e=pickTarget(tw);if(e){fire(tw,e);tw.cd=tstat(tw,'rate');}}}
  // tirs
  for(const s of shots){if(s.k==='ball'){s.t+=dt;const u=Math.min(1,s.t/s.dur);s.x=s.sx+(s.tx-s.sx)*u;s.y=s.sy+(s.ty-s.sy)*u;s.h=Math.sin(u*Math.PI)*.6;
      if(u>=1){s.done=true;for(const e of enemies){if(!e.dead&&!e.air&&(e.x-s.tx)**2+(e.y-s.ty)**2<=s.r*s.r)damage(e,s.dmg,'cannon');}fx.push({k:'boom',x:s.tx,y:s.ty,r:s.r,t:0,life:.3});sfx('boom');}}
    else{const e=s.tg;if(e.dead){s.done=true;continue;}const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy),mv=s.spd*dt;s.ang=Math.atan2(dy,dx);
      if(d<=mv+.1){s.done=true;damage(e,s.dmg,s.src);if(s.k==='ice'){e.slow=Math.max(e.slowT>0?e.slow:0,s.slow);e.slowT=1.6;}}else{s.x+=dx/d*mv;s.y+=dy/d*mv;}}}
  shots=shots.filter(s=>!s.done);
  enemies=enemies.filter(e=>!e.dead);
  for(const f of fx){f.t+=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.9;f.vy*=.9;}}fx=fx.filter(f=>f.t<f.life);
  for(const x of texts){x.t+=dt;x.y-=dt*.7;}texts=texts.filter(x=>x.t<.9);
  if(wave>=WAVES&&!spawnQ.length&&enemies.length===0)endGame(true);
}
function endGame(win){if(state!=='play')return;state='over';hidePop();
  const key=custom.map+'_'+custom.diff,b=BEST[key]||{wave:0,stars:0};
  const reached=win?WAVES:wave-1,stars=reached>=100?3:reached>=50?2:reached>=25?1:0;clearRun();
  b.wave=Math.max(b.wave,reached);b.stars=Math.max(b.stars,stars);BEST[key]=b;saveBest();
  $('overTitle').textContent=win?t('victory'):t('defeat');
  $('overStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('overInfo').textContent=(win?t('winInfo',lives)+' · ':'')+t('reached',reached,b.wave)+' · '+t('starsInfo');
  setTimeout(()=>{if(state==='over')$('over').classList.add('show');},win?400:900);sfx(win?'win':'lose');}

/* ================= RENDU ================= */
function render(){
  ctx.setTransform(1,0,0,1,0,0);if(BG)ctx.drawImage(BG,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);const cs=L.cs;
  // château
  {const[ex,ey]=MAP.end,cx=clamp(ex,0,GW-1),cy=clamp(ey,0,GH-1);const[a,b]=S(cx+.5,cy+.5);ctx.drawImage(SPR.castle,a-cs*.8,b-cs*.95,cs*1.6,cs*1.6);}
  // aperçu de placement
  if(sel&&hover&&state==='play'){const[gx,gy]=hover,key=gx+','+gy;if(gx>=0&&gy>=0&&gx<GW&&gy<GH){const ok=!MAP.path.has(key)&&!MAP.block.has(key)&&!grid[key];const[a,b]=S(gx,gy);
    ctx.fillStyle=ok?'rgba(255,255,255,.25)':'rgba(255,60,60,.3)';ctx.fillRect(a,b,cs,cs);if(ok){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(a+cs/2,b+cs/2,TOW[sel].range[0]*cs,0,TAU);ctx.stroke();}}}
  // tours
  for(const tw of towers){const[a,b]=S(tw.gx,tw.gy);ctx.drawImage(SPR.base[tw.lvl-1],a,b,cs,cs);
    const[cx,cy]=S(tw.x,tw.y);ctx.save();ctx.translate(cx,cy-cs*.12);const ang=L.T?Math.atan2(Math.cos(tw.ang),Math.sin(tw.ang)):tw.ang;ctx.rotate(tw.type==='frost'||tw.type==='tesla'?0:ang);ctx.drawImage(SPR[tw.type+tw.lvl],-cs/2,-cs/2,cs,cs);ctx.restore();
    if(tw===selTower){ctx.strokeStyle='rgba(255,216,107,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,tstat(tw,'range')*cs,0,TAU);ctx.stroke();}}
  // ennemis (au sol puis volants)
  for(const pass of[0,1])for(const e of enemies){if(e.air!==!!pass)continue;const sp=SPR[e.type],img=sp[(e.fr|0)%2],s=img.width;const[a,b]=S(e.x,e.y);
    const yo=e.air?-cs*.25:0;ctx.drawImage(img,a-s/2,b-s/2-cs*.1+yo);
    if(e.slowT>0){ctx.fillStyle='rgba(120,200,255,.35)';ctx.beginPath();ctx.arc(a,b-cs*.1+yo,s*.38,0,TAU);ctx.fill();}
    if(e.hp<e.max){const w=s*.7;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(a-w/2,b-s/2-cs*.12+yo,w,4);ctx.fillStyle=e.type==='boss'?'#ff5a3a':'#7ee06d';ctx.fillRect(a-w/2,b-s/2-cs*.12+yo,w*Math.max(0,e.hp/e.max),4);}}
  // tirs
  for(const s of shots){const[a,b]=S(s.x,s.y);
    if(s.k==='ball'){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(a,b,cs*.08,0,TAU);ctx.fill();ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(a,b-s.h*cs,cs*.1,0,TAU);ctx.fill();}
    else{const ang=L.T?Math.atan2(Math.cos(s.ang||0),Math.sin(s.ang||0)):(s.ang||0);ctx.save();ctx.translate(a,b);ctx.rotate(ang);
      if(s.k==='arrow'){ctx.fillStyle='#6b4a2b';ctx.fillRect(-cs*.18,-1,cs*.3,2);ctx.fillStyle='#ddd';ctx.fillRect(cs*.1,-2,cs*.06,4);}
      else if(s.k==='bolt'){ctx.fillStyle='#5a3d22';ctx.fillRect(-cs*.25,-2,cs*.45,4);ctx.fillStyle='#eee';ctx.beginPath();ctx.moveTo(cs*.28,0);ctx.lineTo(cs*.18,-5);ctx.lineTo(cs*.18,5);ctx.fill();}
      else{ctx.fillStyle='#bfe9ff';ctx.beginPath();ctx.arc(0,0,cs*.09,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-2,cs*.04,0,TAU);ctx.fill();}
      ctx.restore();}}
  // effets
  for(const f of fx){const u=f.t/f.life;
    if(f.k==='p'){const[a,b]=S(f.x,f.y);ctx.globalAlpha=1-u;ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(a,b,f.r*cs,0,TAU);ctx.fill();}
    else if(f.k==='boom'){const[a,b]=S(f.x,f.y);ctx.globalAlpha=1-u;ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(a,b,f.r*cs*(.4+u*.6),0,TAU);ctx.fill();ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(a,b,f.r*cs*.3*(1-u),0,TAU);ctx.fill();}
    else if(f.k==='zap'){ctx.globalAlpha=1-u;ctx.strokeStyle='#d9ccff';ctx.lineWidth=3;ctx.shadowColor='#a78bfa';ctx.shadowBlur=10;ctx.beginPath();
      for(let i=0;i<f.pts.length-1;i++){const[a,b]=S(...f.pts[i]),[c,d]=S(...f.pts[i+1]);if(i===0)ctx.moveTo(a,b);for(let k=1;k<=4;k++){const u2=k/4;ctx.lineTo(a+(c-a)*u2+(k<4?(Math.random()-.5)*cs*.25:0),b+(d-b)*u2+(k<4?(Math.random()-.5)*cs*.25:0));}}ctx.stroke();ctx.shadowBlur=0;}}
  ctx.globalAlpha=1;
  ctx.font='900 '+Math.round(cs*.32)+'px system-ui,sans-serif';ctx.textAlign='center';
  for(const x of texts){const[a,b]=S(x.x,x.y);ctx.globalAlpha=1-x.t/.9;ctx.fillStyle='#000';ctx.fillText(x.s,a+1,b+1);ctx.fillStyle=x.col;ctx.fillText(x.s,a,b);}
  ctx.globalAlpha=1;
}

/* ================= INTERFACE ================= */
function updTop(){$('hGold').innerHTML='<svg class="ic" viewBox="0 0 24 24" width="1.1em" height="1.1em" style="vertical-align:-.2em"><circle cx="12" cy="12" r="10" fill="#f5c542" stroke="#8a6a10" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#c99a1a" stroke-width="2"/></svg> '+gold;$('hLives').innerHTML='<svg class="ic" viewBox="0 0 24 24" width="1.1em" height="1.1em" style="vertical-align:-.2em"><path d="M12 21C3 14 2 9 5 6s6-1 7 2c1-3 4-5 7-2s2 8-7 15z" fill="#ff3b4e" stroke="#7a1020" stroke-width="1.6"/></svg> '+lives;$('hWave').textContent=t('wave',Math.max(1,wave),WAVES);updNext();}
function updNext(){const b=$('nextBtn');if(wave>=WAVES){b.style.display='none';return;}b.style.display='';b.textContent=wave===0||spawnQ.length===0&&enemies.length===0?t('next')+(wave>0?' '+Math.ceil(nextT)+'s':''):t('nextIn',Math.ceil(Math.max(0,nextT)));}
function renderBar(){const bar=$('bar');if(!bar.children.length){bar.innerHTML=TKEYS.map((k,i)=>`<button data-t="${k}"><canvas width="112" height="112"></canvas><i class="k">${i+1}</i><span></span></button>`).join('');}
  [...bar.children].forEach(b=>{const k=b.dataset.t,T=TOW[k];b.querySelector('span').textContent=T.cost;b.classList.toggle('sel',sel===k);b.classList.toggle('no',gold<T.cost);b.title=t(T.k)+' — '+t(T.d);
    const g=b.querySelector('canvas').getContext('2d');g.clearRect(0,0,112,112);towerBase(g,112,1);g.save();g.translate(0,-12);g.drawImage(towerTop(k,112,1),0,0);g.restore();});}
function showPop(tw){selTower=tw;const p=$('pop'),T=TOW[tw.type];$('popName').textContent=t(T.k)+' · '+t('lvl',tw.lvl);$('popInf').textContent=t(T.d);
  const up=$('popUp');if(tw.lvl>=MAXL){up.textContent=t('maxed');up.classList.add('no');}else{const c=T.up[tw.lvl-1];up.textContent=t('upgrade',c);up.classList.toggle('no',gold<c);}
  $('popSell').textContent=t('sell',Math.round(tw.spent*.7));p.classList.add('on');
  const[a,b]=S(tw.x,tw.y),w=p.offsetWidth,h=p.offsetHeight;let x=a-w/2,y=b-L.cs*.6-h;if(y<50)y=b+L.cs*.6;p.style.left=clamp(x,6,W-w-6)+'px';p.style.top=clamp(y,50,H-h-90)+'px';}
function hidePop(){selTower=null;$('pop').classList.remove('on');}
function selectTool(k){sel=sel===k?null:k;hidePop();renderBar();sfx('pick');}
$('bar').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)selectTool(b.dataset.t);});
$('popUp').onclick=()=>{if(selTower)upgradeTower(selTower);};$('popSell').onclick=()=>{if(selTower)sellTower(selTower);};
cv.addEventListener('pointermove',e=>{const[u,v]=toGrid(e.clientX,e.clientY);hover=[Math.floor(u),Math.floor(v)];});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;audioInit();const[u,v]=toGrid(e.clientX,e.clientY),gx=Math.floor(u),gy=Math.floor(v);hover=[gx,gy];const key=gx+','+gy;
  if(grid[key]){sel=null;renderBar();showPop(grid[key]);sfx('pick');return;}
  hidePop();if(sel){if(!placeTower(gx,gy)){sel=null;renderBar();}}});
$('nextBtn').onclick=()=>{if(state==='play'&&(spawnQ.length===0))callWave(wave>0);};
$('spdBtn').onclick=()=>{speed=speed===1?2:speed===2?3:1;$('spdBtn').textContent='×'+speed;sfx('pick');};
$('pauseBtn').onclick=togglePause;$('resumeBtn').onclick=togglePause;
$('restartBtn').onclick=()=>{clearRun();startGame();};$('contBtn').onclick=continueGame;$('againBtn').onclick=startGame;$('playBtn').onclick=()=>{clearRun();startGame();};$('menuBtn').onclick=toMenu;$('quitBtn').onclick=toMenu;
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Escape'){if(sel||selTower){sel=null;hidePop();renderBar();}else togglePause();return;}
  if(e.code==='KeyP')togglePause();
  if(state==='play'){const n=parseInt(e.key);if(n>=1&&n<=5)selectTool(TKEYS[n-1]);if(e.code==='Space'){e.preventDefault();$('nextBtn').click();}if(e.code==='KeyF')$('spdBtn').click();}
  else if(state==='menu'&&e.code==='Enter'&&$('menu').classList.contains('show'))startGame();});
addEventListener('blur',()=>{if(state==='play')togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});

/* ---- menu ---- */
function mapPreview(M){return mk(300,170,g=>{const cs=300/GW;g.fillStyle=M.g1;g.fillRect(0,0,300,170);g.lineCap='round';g.lineJoin='round';g.strokeStyle=M.path2;g.lineWidth=cs*.95;g.beginPath();M.pts.forEach(([x,y],i)=>i?g.lineTo(x*cs,y*cs):g.moveTo(x*cs,y*cs));g.stroke();g.strokeStyle=M.path;g.lineWidth=cs*.75;g.stroke();
  for(const[x,y]of M.decoList){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc((x+.5)*cs,(y+.5)*cs,cs*.3,0,TAU);g.fill();}
  const[ex,ey]=M.end;g.fillStyle='#ffd86b';g.beginPath();g.arc(clamp(ex+.5,.5,GW-.5)*cs,clamp(ey+.5,.5,GH-.5)*cs,cs*.4,0,TAU);g.fill();}).toDataURL();}
const MAPIMG=MAPS.map(mapPreview);
function renderMaps(){updCont();$('maps').innerHTML=MAPS.map((M,i)=>{const b=BEST[i+'_'+custom.diff];const st=b&&b.wave?(b.stars?'★'.repeat(b.stars)+' ':'')+''+b.wave:'';return`<div class="map ${i===custom.map?'sel':''}" data-m="${i}"><img src="${MAPIMG[i]}" alt=""><span class="st">${st}</span><div>${t(M.k)}</div></div>`;}).join('');}
function renderDiff(){$('diff').innerHTML=['easy','normal','hard'].map((k,i)=>`<button data-d="${i}" class="${custom.diff===i?'sel':''}">${t(k)}</button>`).join('');}
function drawPrev(cnv){const g=cnv.getContext('2d'),s=cnv.width;g.clearRect(0,0,s,s);g.fillStyle=MAP.g1;rr(g,0,0,s,s,s*.12);g.fill();
  const c=castleImg(s*.5);g.drawImage(c,s*.42,s*.18,s*.5*1.6*.75,s*.5*1.6*.75);
  towerBase(g,s*.5,3);const tp=towerTop('archer',s*.5,3);g.drawImage(tp,0,-s*.06);}
let ctab=0;
const CTABS=[['tRoof',()=>COLORS.map((c,i)=>`<button class="sw ${custom.roof===i?'sel':''}" style="background:${c}" data-k="roof" data-v="${i}"></button>`).join('')],
 ['tStone',()=>STONES.map((c,i)=>`<button class="sw ${custom.stone===i?'sel':''}" style="background:${c}" data-k="stone" data-v="${i}"></button>`).join('')],
 ['tFlag',()=>COLORS.map((c,i)=>`<button class="sw ${custom.flag===i?'sel':''}" style="background:${c}" data-k="flag" data-v="${i}"></button>`).join('')],
 ['tEmb',()=>EMBS.map((e,i)=>`<button class="${custom.emb===i?'sel':''}" data-k="emb" data-v="${i}"><canvas width="72" height="72" data-e="${e}"></canvas></button>`).join('')]];
function renderCustom(){$('ctabs').innerHTML=CTABS.map(([k],i)=>`<button data-t="${i}" class="${i===ctab?'sel':''}">${t(k)}</button>`).join('');$('cgrid').innerHTML=CTABS[ctab][1]();
  $('cgrid').querySelectorAll('canvas[data-e]').forEach(c=>{const g=c.getContext('2d');g.fillStyle=COLORS[custom.flag];rr(g,4,4,64,64,12);g.fill();drawEmb(g,c.dataset.e,36,36,22,'#fff');});drawPrev($('bigPrev'));}
function refreshCustom(){drawPrev($('prev'));if($('customize').classList.contains('show'))renderCustom();saveCustom();rebuild();}
function showName(){$('kName').textContent=custom.name||t('kingdom');}
function applyLang(){document.documentElement.lang=LANGS[LI][0];document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  $('nick').placeholder=t('nickPh');$('nick').value=custom.name||'';showName();
  $('langs').innerHTML=LANGS.map(([c,n],i)=>'<button class="'+(i===LI?'sel':'')+'" data-l="'+i+'" title="'+n+'">'+flagSVG(c)+'</button>').join('');
  renderMaps();renderDiff();if($('customize').classList.contains('show'))renderCustom();if(state!=='menu'){updTop();renderBar();}}
function setMap(i){MAP=MAPS[i]||MAPS[0];custom.map=MAPS.indexOf(MAP);saveCustom();enemies=[];rebuild();renderMaps();drawPrev($('prev'));}
$('langs').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;LI=+b.dataset.l;try{localStorage.setItem('td_lang',LI);}catch(_){}applyLang();sfx('pick');});
$('maps').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;audioInit();setMap(+b.dataset.m);sfx('pick');});
$('diff').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;custom.diff=+b.dataset.d;saveCustom();renderDiff();renderMaps();sfx('pick');});
$('ctabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;ctab=+b.dataset.t;renderCustom();sfx('pick');});
$('cgrid').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;custom[b.dataset.k]=+b.dataset.v;refreshCustom();sfx('pick');});
$('custBtn').onclick=()=>{audioInit();$('menu').classList.remove('show');$('customize').classList.add('show');renderCustom();sfx('pick');};
$('okBtn').onclick=()=>{$('customize').classList.remove('show');$('menu').classList.add('show');sfx('pick');};
$('randBtn').onclick=()=>{const r=n=>(Math.random()*n)|0;custom.roof=r(COLORS.length);custom.stone=r(STONES.length);custom.flag=r(COLORS.length);custom.emb=r(EMBS.length);refreshCustom();sfx('pick');};
$('nick').addEventListener('input',e=>{custom.name=cleanName(e.target.value);saveCustom();showName();});
$('menu').addEventListener('pointerdown',()=>audioInit());
$('volS').value=Math.round(vol.s*100);$('volM').value=Math.round(vol.m*100);
$('volS').oninput=e=>{vol.s=e.target.value/100;applyVol();sfx('pick');};
$('volM').oninput=e=>{vol.m=e.target.value/100;if(musG&&AC)musG.gain.cancelScheduledValues(AC.currentTime);applyVol();};
$('muteChk').onchange=e=>{audioInit();setMute(e.target.checked);};

let last=performance.now(),nxT=0;
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;update(dt);render();nxT-=dt;if(nxT<=0&&state==='play'){nxT=.25;updNext();if(selTower)showPop(selTower);[...$('bar').children].forEach(b=>b.classList.toggle('no',gold<TOW[b.dataset.t].cost));}
  if(AC&&!muted)musicTick();requestAnimationFrame(frame);}
setMute(muted);MAP=MAPS[custom.map]||MAPS[0];resize();applyLang();drawPrev($('prev'));
requestAnimationFrame(frame);
</script></body></html>
