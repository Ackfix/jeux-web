<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Traffic Blitz</title>
<style>
:root{--acc:#ffcc2e;--accG:rgba(255,204,46,.45);--pan:rgba(14,18,28,.88)}
html,body{margin:0;height:100%;background:#07090f;color:#eef2f8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:safe center;flex-direction:column;gap:12px;padding:16px;text-align:center;box-sizing:border-box;overflow:auto;z-index:5}
.overlay.show{display:flex}
.dim{background:rgba(5,7,12,.62)}
h1{margin:0;font-size:clamp(40px,8vw,74px);font-weight:900;letter-spacing:5px;font-style:italic;color:var(--acc);text-shadow:0 0 26px var(--accG),4px 4px 0 #b91c1c;line-height:1}
h1 span{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.35),4px 4px 0 #b91c1c}
h2{margin:0;font-size:36px;font-weight:900;font-style:italic;color:var(--acc)}
h3{margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
p{margin:0;max-width:600px;line-height:1.45;color:#c9d2e0}
.small{font-size:13px;opacity:.65}
.btn{background:var(--acc);color:#14100a;border:0;border-radius:12px;padding:13px 40px;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:1px;font-style:italic}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#232a3a;color:#eef2f8;font-style:normal}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.langs button{background:none;border:2px solid transparent;border-radius:5px;padding:1px;cursor:pointer;line-height:0;opacity:.55}
.langs button.sel{border-color:var(--acc);opacity:1}
.langs svg{border-radius:2px;display:block}
.cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px}
.card{width:150px;border-radius:12px;border:3px solid transparent;cursor:pointer;overflow:hidden;background:#141924;text-align:left}
.card.sel{border-color:var(--acc)}
.card img{display:block;width:100%;height:80px;object-fit:cover}
.card div{padding:5px 8px;font-weight:800;font-size:13px}
.mode{width:170px;padding:8px 10px;box-sizing:border-box}
.mode b{display:block;font-size:15px}
.mode small{display:block;font-size:11px;opacity:.7;font-weight:600;line-height:1.3;margin-top:2px}
.diff{display:flex;gap:6px}
.diff button{background:#1b2130;color:#cfd6e4;border:2px solid #2a3245;border-radius:9px;padding:6px 14px;font-weight:800;cursor:pointer;font-size:13px}
.diff button.sel{border-color:var(--acc);color:#fff;background:#2a2410}
.topbar{position:fixed;top:10px;right:12px;display:flex;gap:8px;z-index:6;align-items:center}
.chip{background:var(--pan);border-radius:20px;padding:7px 14px;font-weight:900;font-size:15px}
.chip.cr{color:var(--acc)}
.icon{background:var(--pan);color:#fff;border:0;border-radius:10px;width:40px;height:38px;font-size:17px;cursor:pointer}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.75)}
#hud.hide{display:none}
.hl{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:3px;background:rgba(5,8,14,.45);border-radius:12px;padding:8px 14px}
.hl .sc{font-size:30px;font-style:italic;color:var(--acc)}
.hl .ds{font-size:20px;color:#7CFF6B;font-style:italic}
.hl .lv{font-size:18px;letter-spacing:2px}
.hr{position:absolute;right:62px;top:12px;text-align:right;background:rgba(5,8,14,.45);border-radius:12px;padding:8px 14px;display:none}
.hr .tm{font-size:34px;font-style:italic}
.hr .tm.low{color:#ff4a4a}
.hr small{display:block;font-size:13px;opacity:.85}
#pauseBtn,#camBtn{position:absolute;top:12px;pointer-events:auto;background:rgba(20,25,36,.85);color:#fff;border:0;border-radius:10px;width:40px;height:38px;font-size:16px;cursor:pointer}
#pauseBtn{right:12px}#camBtn{right:12px;top:56px}
.spdo{position:absolute;right:18px;bottom:18px;width:170px;height:170px}
.spdo canvas{width:100%;height:100%}
.spdo .v{position:absolute;left:0;right:0;top:58px;text-align:center;font-size:40px;font-style:italic}
.spdo .u{position:absolute;left:0;right:0;top:104px;text-align:center;font-size:12px;opacity:.75}
.spdo .g{position:absolute;left:0;right:0;top:36px;text-align:center;font-size:14px;color:var(--acc)}
.nitro{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:220px;height:16px;border-radius:8px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.25);overflow:hidden}
.nitro i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa)}
.nitro.full{border-color:#7dd3fc;box-shadow:0 0 14px #38bdf8}
.nitro b{position:absolute;inset:0;font-size:11px;line-height:13px;letter-spacing:2px;text-align:center}
#mult{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:18px;font-style:italic;color:#7dd3fc;opacity:0;transition:opacity .2s;white-space:nowrap}
#mult.on{opacity:1}
#combo{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:22px;font-style:italic;color:var(--acc)}
#minspd{position:absolute;left:50%;top:76px;transform:translateX(-50%);font-size:20px;font-style:italic;padding:4px 14px;border-radius:10px;background:rgba(0,0,0,.45);display:none}
#minspd.warn{background:rgba(200,20,20,.75)}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(40px,10vw,100px);font-style:italic;color:var(--acc);text-shadow:0 0 30px var(--accG),4px 4px 0 #000;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
#pops{position:absolute;left:0;right:0;top:56%;height:0}
.pop{position:absolute;left:50%;transform:translateX(-50%);font-size:26px;font-style:italic;white-space:nowrap;animation:pop 1s ease-out forwards;color:#fff}
.pop small{color:var(--acc);font-size:22px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.55))}
#tip{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:17px;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:10px;opacity:0;transition:opacity .4s}
#tip.on{opacity:1}
/* tactile */
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#touch.on{display:block}
#touch button{display:flex;align-items:center;justify-content:center;padding:0;position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.35);background:rgba(15,18,28,.42);color:#fff;font-weight:900;border-radius:50%;width:80px;height:80px;font-size:28px;touch-action:none}
#touch button.on{background:rgba(255,204,46,.5)}
#tl{left:14px;bottom:20px}#tr{left:108px;bottom:20px}
#tg{right:14px;bottom:20px;width:92px!important;height:92px!important}#tb{right:118px;bottom:14px;width:64px!important;height:64px!important;font-size:20px!important}
#tn{right:26px;bottom:126px;width:62px!important;height:62px!important;font-size:22px!important}
body.touch .spdo{right:auto;left:50%;transform:translateX(-50%);bottom:auto;top:4px;width:104px;height:104px}
body.touch .spdo .v{top:30px;font-size:26px}body.touch .spdo .u{top:60px;font-size:10px}body.touch .spdo .g{top:16px;font-size:11px}
body.touch .nitro{bottom:auto;top:108px;width:150px;height:12px}body.touch .nitro b{font-size:9px;line-height:9px}
body.touch #mult{top:128px}body.touch #combo{top:150px}body.touch #minspd{top:180px}body.touch #tip{bottom:auto;top:38%}
/* garage */
#garage{flex-direction:row;align-items:stretch;justify-content:flex-end;padding:0;gap:0}
#gView{flex:1;position:relative}
#gTop{position:absolute;left:14px;top:12px;display:flex;gap:10px;align-items:center}
#gName{position:absolute;left:0;right:0;bottom:16px;text-align:center}
#gName b{font-size:clamp(26px,5vw,44px);font-style:italic;color:#fff;text-shadow:0 3px 10px #000;display:block}
#gName small{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--acc)}
.arrow{position:absolute;top:45%;background:var(--pan);color:#fff;border:0;border-radius:50%;width:52px;height:52px;font-size:22px;cursor:pointer}
#gPrev{left:14px}#gNext{right:14px}
#gPanel{width:380px;max-width:44vw;background:var(--pan);display:flex;flex-direction:column;gap:10px;padding:14px;box-sizing:border-box;overflow:auto;text-align:left}
.strip{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;flex:0 0 auto}
.strip button{flex:0 0 auto;background:#1b2130;border:2px solid #2a3245;border-radius:8px;color:#dfe5ef;font-weight:800;font-size:11px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.strip button.sel{border-color:var(--acc);color:#fff}
.strip button.own{background:#1d2a20}
.stats{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.bar{height:9px;border-radius:5px;background:#252c3c;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:5px}
.bar i.up{background:#7CFF6B}
.st span{text-align:right;opacity:.8}
#gAct{width:100%}
.ctabs{display:flex;gap:5px;flex-wrap:wrap}
.ctabs button{background:#1b2130;color:#cfd6e4;border:0;border-radius:9px;padding:7px 12px;font-weight:800;cursor:pointer;font-size:13px}
.ctabs button.sel{background:var(--acc);color:#14100a}
.cgrid{display:flex;gap:7px;flex-wrap:wrap;min-height:50px}
.cgrid .sw{width:36px;height:36px;border-radius:50%;border:3px solid #2a3245;cursor:pointer;padding:0}
.cgrid .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.cgrid .sw.none{background:#1b2130;color:#fff;font-size:11px;font-weight:800;width:auto;border-radius:18px;padding:0 10px}
.upr{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;width:100%;font-weight:800;font-size:13px}
.pips{display:flex;gap:3px}.pips i{width:12px;height:8px;border-radius:2px;background:#2a3245}.pips i.on{background:#7CFF6B}
.upr button{background:var(--acc);border:0;border-radius:8px;padding:6px 10px;font-weight:900;cursor:pointer;font-size:12px;min-width:84px}
.upr button:disabled{opacity:.4;cursor:default}
.lockmsg{font-size:13px;opacity:.75}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(10,12,20,.9);padding:10px 22px;border-radius:12px;font-weight:900;font-size:18px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.res{display:grid;grid-template-columns:auto auto;gap:4px 24px;background:#141924;border-radius:14px;padding:12px 22px;font-weight:700;text-align:left;font-size:17px}
.res .v{text-align:right;color:#fff}
.res .cr{color:var(--acc);font-size:22px}
.snd{display:flex;flex-direction:column;gap:10px;background:#141924;border-radius:14px;padding:14px 20px}
.snd label{display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
.snd input[type=range]{width:170px;accent-color:var(--acc)}
@media (max-height:820px){
 .overlay{gap:clamp(4px,1.3vh,12px);padding:clamp(6px,1.4vh,14px)}
 h1{font-size:clamp(26px,8vh,60px);letter-spacing:3px}
 #menu>p.intro{display:none}
 #menu .small{font-size:12px}
 h3{font-size:clamp(10px,2.2vh,13px)}
 .langs svg{width:clamp(20px,4.4vh,30px);height:auto}
 .card{width:clamp(84px,20vh,150px);border-width:2px}.card img{height:clamp(28px,9vh,80px)}.card div{padding:2px 6px;font-size:clamp(10px,2.3vh,13px)}
 .mode{width:clamp(110px,24vh,170px);padding:4px 8px}.mode small{display:none}
 .diff button{padding:clamp(3px,.8vh,6px) 12px}
 .btn{padding:clamp(6px,1.7vh,13px) 28px;font-size:clamp(14px,3.2vh,19px)}
}
@media (max-height:520px){#menu .small{display:none}.mode b{font-size:12px}}
@media (max-width:760px){
 #garage{flex-direction:column}
 #gPanel{width:100%;max-width:none;max-height:52vh}
 #gName{bottom:6px}
}
@media (max-width:560px){
 h1{font-size:36px;letter-spacing:2px}
 #menu>p.intro{display:none}
 .cards{max-width:420px}.card{width:calc(33% - 6px);box-sizing:border-box}.card img{height:44px}.mode{width:calc(50% - 6px)}
 .hl{padding:5px 10px}.hl .sc{font-size:22px}.hl .ds{font-size:15px}
 .st{grid-template-columns:90px 1fr 40px}
}
.svi{vertical-align:-.22em;display:inline-block}#camBtn,#sndBtn{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="hud" class="hide">
  <div class="hl"><div class="sc" id="hScore">0</div><div class="ds" id="hDist">0,00 km</div><div class="lv" id="hLives"></div></div>
  <div class="hr" id="hTimeBox"><div class="tm" id="hTime">0:45.0</div><small id="hNext"></small></div>
  <div id="mult"></div><div id="combo"></div><div id="minspd"></div>
  <button id="pauseBtn">❚❚</button><button id="camBtn"></button>
  <div class="spdo"><canvas id="spdC" width="340" height="340"></canvas><div class="g" id="hGear">1</div><div class="v" id="hSpd">0</div><div class="u">KM/H</div></div>
  <div class="nitro" id="hNit"><i></i><b>NITRO</b></div>
  <div id="pops"></div>
  <div id="msg"></div>
  <div id="tip"></div>
</div>
<div id="touch"><button id="tl"></button><button id="tr"></button><button id="tb"></button><button id="tg"></button><button id="tn"></button></div>
<div class="topbar" id="topbar"><div class="chip cr" id="crChip">0</div><button class="icon" id="sndBtn"></button></div>
<div id="toast"></div>

<div class="overlay show dim" id="menu">
  <h1>TRAFFIC <span>BLITZ</span></h1>
  <div class="langs" id="langs"></div>
  <p class="intro" data-i="intro"></p>
  <h3 data-i="modeL"></h3>
  <div class="cards" id="modes"></div>
  <h3 data-i="mapL"></h3>
  <div class="cards" id="maps"></div>
  <div class="diff" id="diff"></div>
  <div class="row"><button class="btn alt" id="garBtn" data-i="garage"></button><button class="btn" id="playBtn" data-i="play"></button></div>
  <p class="small" id="carLine"></p>
  <p class="small" data-i="controls" id="ctlLine"></p>
  <p class="small" id="bestMenu"></p>
</div>

<div class="overlay" id="garage">
  <div id="gView">
    <div id="gTop"><button class="btn alt" id="gBack" data-i="back" style="padding:8px 18px;font-size:15px"></button></div>
    <button class="arrow" id="gPrev">◀</button><button class="arrow" id="gNext">▶</button>
    <div id="gName"><small id="gTier"></small><b id="gCar"></b></div>
  </div>
  <div id="gPanel">
    <div class="strip" id="gStrip"></div>
    <div class="stats" id="gStats"></div>
    <button class="btn" id="gAct"></button>
    <div class="ctabs" id="gTabs"></div>
    <div class="cgrid" id="gGrid"></div>
  </div>
</div>

<div class="overlay dim" id="pause">
  <h2 data-i="pause"></h2>
  <div class="snd">
    <label><span data-i="vol"></span> <input type="range" id="volS" min="0" max="100"></label>
    <label><span data-i="mute"></span> <input type="checkbox" id="muteChk"></label>
  </div>
  <div class="row"><button class="btn" id="resumeBtn" data-i="resume"></button><button class="btn alt" id="restartBtn" data-i="restart"></button><button class="btn alt" id="quitBtn" data-i="menu"></button></div>
</div>

<div class="overlay dim" id="over">
  <h2 id="overTitle"></h2>
  <div class="res" id="overRes"></div>
  <p id="overInfo"></p>
  <div class="row"><button class="btn" id="againBtn" data-i="again"></button><button class="btn alt" id="overGar" data-i="garage"></button><button class="btn alt" id="menuBtn" data-i="menu"></button></div>
</div>
